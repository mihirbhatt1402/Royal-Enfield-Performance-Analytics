    if (!allCity){ if (cf  === FILTER_CLEARED) continue; if (!cf.has(r.city))    continue; }
    const statusName = r.statusName || '';
    const isRA = isRetailedLead(r);
    aoa.push([
      r.encryptMobile||'', r.idVerifiedLead||'', r.opty_id,
      fmtD(r.leadDate), r.lead_month, r.brand||'', r.model,
      r.verifiedDealer||'', r.dealerId||'', r.oemCrmId||'',
      r.city, r.state, r.dealerName||'', r.enquiryId||'', r.utmCampaign||'',
      r.lt, r.source, statusName,
      isRA ? (r.purchasedModel||'') : '',
      isRA ? (r.booking_month||'') : '',
      isRA ? (r.callType||'') : '',
      isRA ? fmtD(r.retailDate) : '',
      r.webId || 'Unknown',
    ]);
  }
  exportCsv(aoa, filename);
}

function makeAggCsv(agg, dimLabel, filename) {
  if (!agg) return;
  const srcKeys = Object.keys(agg.grandSrc || {});
  const hdr = [dimLabel, 'Leads', 'Retail', 'Contrib%', 'L2R%',
    ...srcKeys.flatMap(s => [s+' L', s+' R', s+' L2R%'])];
  const rows = [hdr];
  const entries = Object.entries(agg.dimAggs).sort((a,b) => b[1].total.l - a[1].total.l);
  for (const [dk, da] of entries) {
    const r = [dk, da.total.l, da.total.r,
      agg.grand.l > 0 ? +(da.total.l/agg.grand.l*100).toFixed(1) : 0,
      +da.total.l2r.toFixed(1)];
    for (const s of srcKeys) { const sv = da.src[s] || {l:0,r:0,l2r:0}; r.push(sv.l, sv.r, +sv.l2r.toFixed(1)); }
    rows.push(r);
  }
  const gt = ['Grand Total', agg.grand.l, agg.grand.r, 100, +agg.grand.l2r.toFixed(1)];
  for (const s of srcKeys) { const sv = agg.grandSrc[s] || {l:0,r:0,l2r:0}; gt.push(sv.l, sv.r, +sv.l2r.toFixed(1)); }
  rows.push(gt);
  exportCsv(rows, filename);
}

/* ════════════════════════════════════════════════════════════════════
   MULTI-SELECT FILTER COMPONENT
   ════════════════════════════════════════════════════════════════════ */

// Sentinel: a frozen Set containing an unmatchable string.
// When used as a filter, aggregation code sees size>0 (not "all") but
// has() returns false for every real option → zero records for that dimension.
const FILTER_CLEARED = Object.freeze(new Set(['\x00']));

// Canonical display name for purchased model — used in buildPayload and in filter comparisons
const _RE_PUR_MDL_CANONICAL = {};
function canonPurMdl(s) { return _RE_PUR_MDL_CANONICAL[s] || s; }

const MultiSelect = React.memo(function MultiSelect({ label, options, selected, onChange }) {
  const [open, setOpen] = useState(false);
  const ref = useRef();

  useEffect(() => {
    function hdl(e) { if (ref.current && !ref.current.contains(e.target)) setOpen(false); }
    document.addEventListener('mousedown', hdl);
    return () => document.removeEventListener('mousedown', hdl);
  }, []);

  const isClear = selected === FILTER_CLEARED;
  const isAll   = !isClear && (!selected || selected.size === 0);
  const count   = !isClear && selected ? selected.size : 0;

  function toggle(opt) {
    if (isClear) { onChange(new Set([opt])); return; }
    const next = new Set(selected || []);
    if (isAll) {
      options.forEach(o => { if (o !== opt) next.add(o); });
    } else {
      if (next.has(opt)) next.delete(opt); else next.add(opt);
    }
    onChange(next.size === options.length ? new Set() : next);
  }
  function selectAll()  { onChange(new Set()); }
  function clearFilter() { onChange(FILTER_CLEARED); }

  return ce('div', { style: { position:'relative' }, ref },
    ce('button', {
      className: 'ms-btn' + (open ? ' open' : ''),
      onClick: () => setOpen(p => !p)
    },
      label,
      isAll
        ? ce('span', { style:{color:'#94A3B8',fontSize:10} }, 'All ▾')
        : isClear
          ? ce('span', { style:{color:'#64748B',fontSize:10} }, 'None ▾')
          : ce('span', { className:'ms-count' }, count),
      !isAll && !isClear && ce('span', {style:{color:'#94A3B8',fontSize:10}}, '▾')
    ),
    open && ce('div', { className:'ms-dropdown' },
      ce('div', { className:'ms-dropdown-header' },
        ce('span', { style:{fontSize:10,fontWeight:700,color:'#475569',textTransform:'uppercase',letterSpacing:'.06em'} }, label),
        ce('div', { style:{display:'flex',gap:8} },
          ce('button', { onClick: selectAll,   style:{fontSize:10,background:'none',border:'none',color:'#0891B2',cursor:'pointer',fontWeight:700} }, 'All'),
          ce('button', { onClick: clearFilter, style:{fontSize:10,background:'none',border:'none',color:'#64748B',cursor:'pointer',fontWeight:700} }, 'Clear')
        )
      ),
      ce('div', { className:'ms-dropdown-list' },
        options.map(opt => ce('label', { key:opt, className:'ms-option' },
          ce('input', {
            type:'checkbox', checked: !isClear && (isAll || selected.has(opt)),
            onChange: () => toggle(opt)
          }),
          ce('span', null, opt)
        ))
      )
    )
  );
});

/* ════════════════════════════════════════════════════════════════════
   DIMENSION GRID WITH EXPAND/COLLAPSE SOURCE GROUPS + CONTRIB%
   agg        : { grand, grandSrc, dimAggs }
   srcGroups  : array of { id, label, color, srcs, subGroups }
   dimLabel   : string for the row header column
   expandedGrps : Set of group ids that are expanded
   onToggleGrp : (id) => void
   expandedRows : Set of dim keys where sub-rows are shown (optional)
   subRowsOf   : (dimKey) => array of { label, srcMap } (optional, for LT expand)
   ════════════════════════════════════════════════════════════════════ */
const DimGrid = React.memo(function DimGrid({
  agg, srcGroups, dimLabel, expandedGrps, onToggleGrp,
  expandedRows, onToggleRow, subRowsFn, grandForContrib, noSort, viewerMode, noGroupHeaders
}) {
  if (!agg) return null;
  const { grand, grandSrc, dimAggs } = agg;
  const gL = (grandForContrib || grand).l;
  const gR = (grandForContrib || grand).r;

  function contrib(l) { return gL > 0 ? l / gL * 100 : 0; }
  function rContrib(r) { return gR > 0 ? r / gR * 100 : 0; }

  // Flatten expanded groups → visible column list (sub-groups become top-level headers)
  const visibleCols = [];
  for (const grp of srcGroups) {
    if (expandedGrps && expandedGrps.has(grp.id)) {
      const sgs = grp.subGroups.filter(sg => sg.srcs.length > 0);
      if (sgs.length > 0) {
        sgs.forEach((sg, i) => visibleCols.push({
          ...sg,
          borderLeft: i === 0 ? '2px solid ' + grp.color : null,
          parentId: grp.id,
          isChild: true
        }));
      } else {
        visibleCols.push({ ...grp, isChild: false });
      }
    } else {
      visibleCols.push({ ...grp, isChild: false });
    }
  }

  // 5 data cells for one visible column: Leads | L.Contrib% | Retail | R.Contrib% | L2R%
  function colCells(srcMap, col) {
    const a = grpSum(srcMap, col.srcs);
    const bl = col.borderLeft ? { borderLeft: col.borderLeft } : {};
    return [
      ce('td', { key: col.id+'l', style: bl }, Nf(a.l)),
      ce('td', { key: col.id+'lc' }, a.l > 0 ? Pf(contrib(a.l)) : '—'),
      ce('td', { key: col.id+'r', style:{ color: col.color, fontWeight:700 } }, Nf(a.r)),
      ce('td', { key: col.id+'rc' }, a.r > 0 ? Pf(rContrib(a.r)) : '—'),
      ce('td', { key: col.id+'l2r', style:{ color:'#D97706', fontWeight:600 } }, Pf(a.l2r)),
    ];
  }

  function renderRow(label, tot, srcMap, isTotal, isSection, dimKey, isSub) {
    const rowClass = isTotal ? 'total-row' : isSection ? 'section-row' : isSub ? 'sub-row' : '';
    const canExpand = !isTotal && !isSub && expandedRows !== undefined && onToggleRow;
    const isExpanded = canExpand && expandedRows.has(dimKey);
    const tdClass = isSub ? 'sub-label' : 'label';
    const labelContent = canExpand
      ? ce('span', { style:{display:'flex',alignItems:'center',gap:6} },
          ce('span', { style:{fontSize:10,color:'#94A3B8'} }, isExpanded ? '▾' : '▸'),
          label
        )
      : label;
    return ce('tr', {
      className: rowClass, key: label + (isSub ? '_sub' : ''),
      onClick: canExpand ? () => onToggleRow(dimKey) : undefined,
      style: canExpand ? { cursor:'pointer' } : {}
    },
      ce('td', { className: tdClass, style: isTotal ? { color:'#1A237E' } : {} }, labelContent),
      ce('td', { key:'tl' }, Nf(tot.l)),
      ce('td', { key:'tlc' }, tot.l > 0 ? Pf(contrib(tot.l)) : '—'),
      ce('td', { key:'tr', style:{ color:'#0891B2', fontWeight:700 } }, Nf(tot.r)),
      ce('td', { key:'trc' }, tot.r > 0 ? Pf(rContrib(tot.r)) : '—'),
      ce('td', { key:'tl2r', style:{ color:'#D97706', fontWeight:700 } }, tot.l2r > 0 ? Pf(tot.l2r) : '—'),
      ...(viewerMode ? [] : visibleCols.flatMap(col => colCells(srcMap, col)))
    );
  }

  const dimRows = noSort
    ? Object.entries(dimAggs)
    : Object.entries(dimAggs).sort((a,b) => b[1].total.l - a[1].total.l);

  // Header row 1 — top-level group names (sub-groups shown as peers when parent expanded)
  const hdr1 = [
    ce('th', { key:'dim', className:'left', rowSpan:2, style:{minWidth:160,zIndex:3,background:'#1D4ED8',color:'#fff'} }, dimLabel),
    ce('th', { key:'tot', colSpan:5, style:{background:'#1D4ED8',color:'#fff'} }, 'TOTAL'),
    ...(viewerMode ? [] : visibleCols.map(col => {
      const hasChildren = !col.isChild && col.subGroups && col.subGroups.filter(sg=>sg.srcs.length>0).length > 1;
      const canToggle = onToggleGrp && (hasChildren || col.isChild);
      const toggleId = col.isChild ? col.parentId : col.id;
      const arrow = hasChildren ? '▾ ' : col.isChild ? '▴ ' : '';
      return ce('th', {
        key: col.id, colSpan: 5,
        className: canToggle ? 'grp-toggle' : '',
        style: {
          background: col.color,
          color: '#fff',
          borderTop: '2px solid ' + col.color + '88',
          ...(col.borderLeft ? { borderLeft: col.borderLeft } : {})
        },
        onClick: canToggle ? () => onToggleGrp(toggleId) : undefined
      }, arrow + col.label);
    }))
  ];

  // Header row 2 — LEADS | L.CONTRIB% | RETAIL | R.CONTRIB% | L2R% per visible col
  const hdr2 = [
    ...(noGroupHeaders ? [ce('th', { key:'dim', className:'left', style:{minWidth:160,zIndex:3,background:'#1D4ED8',color:'#fff'} }, dimLabel)] : []),
    ce('th', { key:'tl', className:'sub' }, 'Leads'),
    ce('th', { key:'tlc', className:'sub' }, 'L.Contrib%'),
    ce('th', { key:'tr', className:'sub' }, 'Retail'),
    ce('th', { key:'trc', className:'sub' }, 'R.Contrib%'),
    ce('th', { key:'tl2r', className:'sub' }, 'L2R%'),
    ...(viewerMode ? [] : visibleCols.flatMap(col => [
      ce('th', { key:col.id+'l', className:'sub', style: col.borderLeft ? {borderLeft:col.borderLeft} : {} }, 'Leads'),
      ce('th', { key:col.id+'lc', className:'sub' }, 'L.Contrib%'),
      ce('th', { key:col.id+'r', className:'sub' }, 'Retail'),
      ce('th', { key:col.id+'rc', className:'sub' }, 'R.Contrib%'),
      ce('th', { key:col.id+'l2r', className:'sub' }, 'L2R%'),
    ]))
  ];

  const rows = [];

  for (const [dimKey, da] of dimRows) {
    rows.push(renderRow(dimKey, da.total, da.src, false, false, dimKey, false));
    // Sub-rows if this dim is expanded
    if (expandedRows && expandedRows.has(dimKey) && subRowsFn) {
      const subRows = subRowsFn(dimKey, da);
      for (const sr of subRows) {
        rows.push(renderRow(sr.label, sr.tot, sr.srcMap, false, false, null, true));
      }
    }
  }
  rows.push(renderRow('∑ Grand Total', grand, grandSrc, true, false, null, false));

  return ce('div', { className:'scroll-x' },
    ce('table', null,
      ce('thead', null,
        ...(noGroupHeaders ? [] : [ce('tr', null, ...hdr1)]),
        ce('tr', null, ...hdr2),
      ),
      ce('tbody', null, ...rows)
    )
  );
});

/* ════════════════════════════════════════════════════════════════════
   MONTHLY GRIDS WRAPPER
   Renders one DimGrid per selected month.
   ════════════════════════════════════════════════════════════════════ */
function MonthlyGrids({ title, months, renderAgg, srcGroups, dimLabel, expandedGrps, onToggleGrp, expandedRows, onToggleRow, subRowsFn, noPrefix, viewerMode, noGroupHeaders, onDetailedCsv, noExport }) {
  const aggs = useMemo(() => months.map(M => ({ M, agg: renderAgg(M) })), [months, renderAgg]);
  const summaryAgg = useMemo(() => {
    let gL=0, gR=0;
    const gsAcc={}, daAcc={};
    for (const { agg } of aggs) {
      if (!agg || (agg.grand.l===0 && agg.grand.r===0)) continue;
      gL+=agg.grand.l; gR+=agg.grand.r;
      for (const [s,sv] of Object.entries(agg.grandSrc)) {
        if (!gsAcc[s]) gsAcc[s]=[0,0]; gsAcc[s][0]+=sv.l; gsAcc[s][1]+=sv.r;
      }
      for (const [d,da] of Object.entries(agg.dimAggs)) {
        if (!daAcc[d]) daAcc[d]={total:[0,0],src:{}};
        daAcc[d].total[0]+=da.total.l; daAcc[d].total[1]+=da.total.r;
        for (const [s,sv] of Object.entries(da.src)) {
          if (!daAcc[d].src[s]) daAcc[d].src[s]=[0,0];
          daAcc[d].src[s][0]+=sv.l; daAcc[d].src[s][1]+=sv.r;
        }
      }
    }
    if (gL===0) return null;
    const grandSrc={};
    for (const [s,v] of Object.entries(gsAcc)) grandSrc[s]=fin(v[0],v[1]);
    const dimAggs={};
    for (const [d,dv] of Object.entries(daAcc)) {
      const srcAgg={};
      for (const [s,sv] of Object.entries(dv.src)) srcAgg[s]=fin(sv[0],sv[1]);
      dimAggs[d]={total:fin(dv.total[0],dv.total[1]),src:srcAgg};
    }
    return {grand:fin(gL,gR),grandSrc,dimAggs};
  }, [aggs]);
  return ce('div', { className:'fade-up' },
    summaryAgg && ce('div', { className:'card', style:{padding:'16px 18px',marginBottom:14,borderTop:'3px solid #003087'} },
      ce('div', { style:{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:10} },
        ce('div', { className:'section-title', style:{marginBottom:0} }, '∑ All Months — Summary'),
        ce('div',{style:{display:'flex',gap:0}},
          !noExport && ce(CsvBtn, { onClick:()=>makeAggCsv(summaryAgg, dimLabel, (title||dimLabel).replace(/[^a-z0-9]/gi,'_')+'_AllMonths.csv') }),
          !noExport && onDetailedCsv && ce(DetailedCsvBtn, { onClick:()=>onDetailedCsv((title||dimLabel).replace(/\s/g,'_'), null) })
        )
      ),
      ce(DimGrid, { agg:summaryAgg, srcGroups, dimLabel, expandedGrps, onToggleGrp, expandedRows, onToggleRow, subRowsFn, viewerMode, noGroupHeaders })
    ),
    aggs.map(({ M, agg }) => {
      if (!agg || (agg.grand.l === 0 && agg.grand.r === 0)) return null;
      return ce('div', { key: M, className:'card', style:{ padding:'16px 18px', marginBottom:14 } },
        ce('div', { style:{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:10} },
          ce('div', { className:'section-title', style:{marginBottom:0} }, noPrefix ? M : (title || dimLabel) + ' — ' + M),
          ce('div',{style:{display:'flex',gap:0}},
            !noExport && ce(CsvBtn, { onClick:()=>makeAggCsv(agg, dimLabel, (title||dimLabel).replace(/[^a-z0-9]/gi,'_')+'_'+M.replace(/[^a-z0-9]/gi,'_')+'.csv') }),
            !noExport && onDetailedCsv && ce(DetailedCsvBtn, { onClick:()=>onDetailedCsv((title||dimLabel).replace(/\s/g,'_'), M) })
          )
        ),
        ce(DimGrid, { agg, srcGroups, dimLabel, expandedGrps, onToggleGrp, expandedRows, onToggleRow, subRowsFn, viewerMode, noGroupHeaders })
      );
    })
  );
}

/* ════════════════════════════════════════════════════════════════════
   OVERVIEW TAB
   ════════════════════════════════════════════════════════════════════ */
const OverviewTab = React.memo(function OverviewTab({ data, filters, RT }) {
  const { maps, monthly, sm, cm, mxst, univ: univRaw, csm: csmRaw } = data;
  const csm = csmRaw || [];
  const univ = univRaw || [];
  const pmsm = data.pmsm || [];
  const pm_csm = data.pm_csm || [];
  const pm_mxst = data.pm_mxst || [];
  const getLR = useMemo(() => makeLR(data.rt_cols, RT), [data.rt_cols, RT]);
  const chartRef = useRef(); const chartInst = useRef();

  const allSrcs = useMemo(() => [...new Set(maps.src)], [maps]);
  const srcGroups = useMemo(() => buildSrcGroups(allSrcs), [allSrcs]);
  const paidGrp = srcGroups.find(g => g.id === 'paid');
  const orgGrp  = srcGroups.find(g => g.id === 'organic');
  const hasCityFilter = filters.cities && filters.cities.size > 0 && cm && maps.city;

  const totals = useMemo(() => {
    const allM = !filters.months || filters.months.size === 0;
    const allS = !filters.sources || filters.sources.size === 0;
    const allPurMdl = !filters.purMdls || filters.purMdls.size === 0;
    const univF = makeUnivFilter(filters);
    let gL=0,gR=0,pL=0,pR=0,oL=0,oR=0,dL=0,coL=0;
    if (hasCityFilter) {
      for (const row of cm) {
        const city = maps.city[row[0]];
        if (!filters.cities.has(city)) continue;
        const m = maps.lm[row[1]];
        if (!allM && !filters.months.has(m)) continue;
        const [l,r] = getLR(row); gL+=l;
        if (allPurMdl) { gR+=r; if (data.rt_cols) { dL+=row[row.length-2]; coL+=row[row.length-1]; } }
      }
    } else if (univF) {
      for (const row of univ) {
        const m = maps.lm[row[4]];
        if (!allM && !filters.months.has(m)) continue;
        const src = maps.src[row[1]];
        if (!allS && !filters.sources.has(src)) continue;
        if (!univF(row, maps)) continue;
        const [l,r] = getLR(row); gL+=l;
        if (allPurMdl) { gR+=r; if (data.rt_cols) { dL+=row[row.length-2]; coL+=row[row.length-1]; } }
        if (paidGrp && paidGrp.srcs.includes(src)) { pL+=l; if (allPurMdl) pR+=r; }
        if (orgGrp  && orgGrp.srcs.includes(src))  { oL+=l; if (allPurMdl) oR+=r; }
      }
    } else {
      for (const row of sm) {
        const m = maps.lm[row[1]];
        if (!allM && !filters.months.has(m)) continue;
        const src = maps.src[row[0]];
        if (!allS && !filters.sources.has(src)) continue;
        const [l,r] = getLR(row); gL+=l;
        if (allPurMdl) { gR+=r; if (data.rt_cols) { dL+=row[row.length-2]; coL+=row[row.length-1]; } }
        if (paidGrp && paidGrp.srcs.includes(src)) { pL+=l; if (allPurMdl) pR+=r; }
        if (orgGrp  && orgGrp.srcs.includes(src))  { oL+=l; if (allPurMdl) oR+=r; }
      }
    }
    if (!allPurMdl) {
      const useCsm = hasCityFilter && pm_csm.length > 0;
      const retailMtx = useCsm ? pm_csm : pmsm;
      for (const row of retailMtx) {
        if (!filters.purMdls.has(maps.purMdl[row[0]])) continue;
        let m, src;
        if (useCsm) {
          if (!filters.cities.has(maps.city[row[1]])) continue;
          src = maps.src[row[2]]; m = maps.lm[row[3]];
        } else {
          src = maps.src[row[1]]; m = maps.lm[row[2]];
        }
        if (!allM && !filters.months.has(m)) continue;
        if (!allS && !filters.sources.has(src)) continue;
        const [,r] = getLR(row); gR+=r;
        if (data.rt_cols) { dL+=row[row.length-2]; coL+=row[row.length-1]; }
        if (!useCsm) {
          if (paidGrp && paidGrp.srcs.includes(src)) pR+=r;
          if (orgGrp  && orgGrp.srcs.includes(src))  oR+=r;
        }
      }
    }
    return { l:gL,r:gR,l2r:gL>0?gR/gL*100:0, pL,pR,pL2r:pL>0?pR/pL*100:0, oL,oR,oL2r:oL>0?oR/oL*100:0, dL, coL };
  }, [sm, univ, cm, pmsm, pm_csm, maps, filters, paidGrp, orgGrp, hasCityFilter, getLR]);

  const trendData = useMemo(() => {
    const byMonth = new Map();
    const allM = !filters.months || filters.months.size === 0;
    const allS = !filters.sources || filters.sources.size === 0;
    const allPurMdl = !filters.purMdls || filters.purMdls.size === 0;
    const univF = makeUnivFilter(filters);
    if (hasCityFilter) {
      for (const row of cm) {
        const city = maps.city[row[0]];
        if (!filters.cities.has(city)) continue;
        const m = maps.lm[row[1]];
        const cur = byMonth.get(m) || [0,0];
        const [l,r] = getLR(row); cur[0]+=l;
        if (allPurMdl) cur[1]+=r;
        byMonth.set(m, cur);
      }
    } else if (univF) {
      for (const row of univ) {
        const m = maps.lm[row[4]];
        if (!allM && !filters.months.has(m)) continue;
        if (!allS && !filters.sources.has(maps.src[row[1]])) continue;
        if (!univF(row, maps)) continue;
        const cur = byMonth.get(m) || [0,0];
        const [l,r] = getLR(row); cur[0]+=l;
        if (allPurMdl) cur[1]+=r;
        byMonth.set(m, cur);
      }
    } else {
      for (const row of monthly) {
        const m = maps.lm[row[0]];
        const [l,r] = getLR(row); byMonth.set(m, [l, allPurMdl ? r : 0]);
      }
    }
    if (!allPurMdl) {
      const useCsm = hasCityFilter && pm_csm.length > 0;
      const retailMtx = useCsm ? pm_csm : pmsm;
      for (const row of retailMtx) {
        if (!filters.purMdls.has(maps.purMdl[row[0]])) continue;
        let m, src;
        if (useCsm) {
          if (!filters.cities.has(maps.city[row[1]])) continue;
          src = maps.src[row[2]]; m = maps.lm[row[3]];
        } else {
          src = maps.src[row[1]]; m = maps.lm[row[2]];
          if (!allM && !filters.months.has(m)) continue;
          if (!allS && !filters.sources.has(src)) continue;
        }
        const [,r] = getLR(row);
        const cur = byMonth.get(m) || [0,0]; cur[1]+=r; byMonth.set(m, cur);
      }
    }
    return [...byMonth.entries()]
      .sort((a,b) => monthOrder(a[0]) - monthOrder(b[0]))
      .map(([m, v]) => ({ m, l: v[0], r: v[1], l2r: v[0]>0 ? v[1]/v[0]*100 : 0 }));
  }, [monthly, univ, cm, pmsm, pm_csm, maps, filters, hasCityFilter, getLR]);

  const srcBreak = useMemo(() => {
    const allM = !filters.months || filters.months.size === 0;
    const allS = !filters.sources || filters.sources.size === 0;
    const allPurMdl = !filters.purMdls || filters.purMdls.size === 0;
    const univF = makeUnivFilter(filters);
    const bySrc = new Map();
    if (hasCityFilter && !univF && csm.length > 0) {
      for (const row of csm) {
        const city = maps.city[row[0]];
        if (!filters.cities.has(city)) continue;
        const m = maps.lm[row[2]];
        if (!allM && !filters.months.has(m)) continue;
        const src = maps.src[row[1]];
        if (!allS && !filters.sources.has(src)) continue;
        const [l,r] = getLR(row);
        const c = bySrc.get(src)||[0,0]; c[0]+=l; if (allPurMdl) c[1]+=r; bySrc.set(src,c);
      }
    } else {
      const table  = univF ? univ : sm;
      const getSrc = univF ? (row => maps.src[row[1]]) : (row => maps.src[row[0]]);
      const getM   = univF ? (row => maps.lm[row[4]])  : (row => maps.lm[row[1]]);
      for (const row of table) {
        const m = getM(row);
        if (!allM && !filters.months.has(m)) continue;
        const src = getSrc(row);
        if (!allS && !filters.sources.has(src)) continue;
        if (univF && !univF(row, maps)) continue;
        const [l,r] = getLR(row);
        const c = bySrc.get(src)||[0,0]; c[0]+=l; if (allPurMdl) c[1]+=r; bySrc.set(src,c);
      }
    }
    if (!allPurMdl) {
      const useCsm = hasCityFilter && !univF && pm_csm.length > 0;
      const retailMtx = useCsm ? pm_csm : pmsm;
      for (const row of retailMtx) {
        if (!filters.purMdls.has(maps.purMdl[row[0]])) continue;
        let m, src;
        if (useCsm) {
          if (!filters.cities.has(maps.city[row[1]])) continue;
          src = maps.src[row[2]]; m = maps.lm[row[3]];
        } else {
          src = maps.src[row[1]]; m = maps.lm[row[2]];
        }
        if (!allM && !filters.months.has(m)) continue;
        if (!allS && !filters.sources.has(src)) continue;
        const [,r] = getLR(row);
        const c = bySrc.get(src)||[0,0]; c[1]+=r; bySrc.set(src,c);
      }
    }
    return [...bySrc.entries()]
      .map(([s,v]) => ({ src:s, l:v[0], r:v[1], l2r:v[0]>0?v[1]/v[0]*100:0 }))
      .sort((a,b) => b.l-a.l);
  }, [sm, csm, univ, pmsm, pm_csm, maps, filters, getLR, hasCityFilter]);

  const heatData = useMemo(() => {
    const allM   = !filters.months || filters.months.size === 0;
    const allMdl = !filters.models || filters.models.size === 0;
    const allSt  = !filters.states || filters.states.size === 0;
    const allLT  = !filters.leadTypes || filters.leadTypes.size === 0;
    const modelTot = new Map(), stateTot = new Map(), cell = new Map();
    if (!allLT) {
      // leadType filter active — derive from univ (has all 5 dims)
      for (const row of univ) {
        const mdl = maps.mdl[row[0]], st = maps.st[row[2]], m = maps.lm[row[4]];
        const lt  = maps.lt[row[3]];
        if (!allM   && !filters.months.has(m))    continue;
        if (!allMdl && !filters.models.has(mdl))  continue;
        if (!allSt  && !filters.states.has(st))   continue;
        if (!allLT  && !filters.leadTypes.has(lt)) continue;
        const l = getLR(row)[0];
        const k = mdl + '\x00' + st;
        cell.set(k, (cell.get(k) || 0) + l);
        modelTot.set(mdl, (modelTot.get(mdl) || 0) + l);
        stateTot.set(st,  (stateTot.get(st)  || 0) + l);
      }
    } else {
      for (const row of mxst || []) {
        const mdl = maps.mdl[row[0]], st = maps.st[row[1]], m = maps.lm[row[2]], v = row[3];
        if (!allM   && !filters.months.has(m))   continue;
        if (!allMdl && !filters.models.has(mdl)) continue;
        if (!allSt  && !filters.states.has(st))  continue;
        const k = mdl + '\x00' + st;
        cell.set(k, (cell.get(k) || 0) + v);
        modelTot.set(mdl, (modelTot.get(mdl) || 0) + v);
        stateTot.set(st,  (stateTot.get(st)  || 0) + v);
      }
    }
    const top10 = [...modelTot.entries()].sort((a,b) => b[1]-a[1]).map(e=>e[0]);
    const top15 = [...stateTot.entries()].sort((a,b) => b[1]-a[1]).slice(0,15).map(e=>e[0]);
    const maxV  = Math.max(1, ...[...cell.values()]);
    return { cell, top10, top15, maxV };
  }, [mxst, univ, maps, filters, getLR]);

  const heatDataRetail = useMemo(() => {
    const allM      = !filters.months   || filters.months.size   === 0;
    const allMdl    = !filters.models   || filters.models.size   === 0;
    const allSt     = !filters.states   || filters.states.size   === 0;
    const allLT     = !filters.leadTypes|| filters.leadTypes.size=== 0;
    const allPurMdl = !filters.purMdls  || filters.purMdls.size  === 0;
    const modelTot = new Map(), stateTot = new Map(), cell = new Map();
    if (!allPurMdl) {
      // Purchased Model filter active — use pm_mxst (purMdl×state×month, retail only)
      // pm_mxst row: [purMI, sti, li, 0, Ra, Rd, Rc]
      for (const row of pm_mxst) {
        const purMdl = maps.purMdl[row[0]];
        if (!filters.purMdls.has(purMdl)) continue;
        const st = maps.st[row[1]], m = maps.lm[row[2]];
        if (!allM  && !filters.months.has(m))  continue;
        if (!allSt && !filters.states.has(st)) continue;
        const r = getLR(row)[1];
        if (!r) continue;
        const k = purMdl + '\x00' + st;
        cell.set(k, (cell.get(k) || 0) + r);
        modelTot.set(purMdl, (modelTot.get(purMdl) || 0) + r);
        stateTot.set(st,     (stateTot.get(st)     || 0) + r);
      }
    } else if (!allLT) {
      // Lead Type filter active — derive from univ (has all 5 dims), use lead model attribution
      for (const row of univ) {
        const mdl = maps.mdl[row[0]], st = maps.st[row[2]], m = maps.lm[row[4]];
        const lt  = maps.lt[row[3]];
        if (!allM   && !filters.months.has(m))     continue;
        if (!allMdl && !filters.models.has(mdl))   continue;
        if (!allSt  && !filters.states.has(st))    continue;
        if (!allLT  && !filters.leadTypes.has(lt)) continue;
        const r = getLR(row)[1];
        if (!r) continue;
        const k = mdl + '\x00' + st;
        cell.set(k, (cell.get(k) || 0) + r);
        modelTot.set(mdl, (modelTot.get(mdl) || 0) + r);
        stateTot.set(st,  (stateTot.get(st)  || 0) + r);
      }
    } else {
      // No purMdls / LT filter — use pre-aggregated mxst (lead model attribution)
      for (const row of mxst || []) {
        const mdl = maps.mdl[row[0]], st = maps.st[row[1]], m = maps.lm[row[2]];
        if (!allM   && !filters.months.has(m))   continue;
        if (!allMdl && !filters.models.has(mdl)) continue;
        if (!allSt  && !filters.states.has(st))  continue;
        const r = getLR(row)[1];
        if (!r) continue;
        const k = mdl + '\x00' + st;
        cell.set(k, (cell.get(k) || 0) + r);
        modelTot.set(mdl, (modelTot.get(mdl) || 0) + r);
        stateTot.set(st,  (stateTot.get(st)  || 0) + r);
      }
    }
    const top10 = [...modelTot.entries()].sort((a,b) => b[1]-a[1]).map(e=>e[0]);
    const top15 = [...stateTot.entries()].sort((a,b) => b[1]-a[1]).slice(0,15).map(e=>e[0]);
    const maxV  = Math.max(1, ...[...cell.values()]);
    return { cell, top10, top15, maxV };
  }, [mxst, pm_mxst, univ, maps, filters, getLR]);

  // Chart
  useEffect(() => {
    const canvas = chartRef.current;
    if (!canvas || !window.Chart) return;
    if (chartInst.current) { try { chartInst.current.destroy(); } catch(e){} }
    chartInst.current = new Chart(canvas, {
      type:'bar',
      data:{
        labels: trendData.map(d => d.m),
        datasets:[
          { label:'Leads',   data:trendData.map(d=>d.l), backgroundColor:'#0030872a', borderColor:'#003087', borderWidth:1.5, borderRadius:3, yAxisID:'y' },
          { label:'Retails', data:trendData.map(d=>d.r), backgroundColor:'#0891B255', borderColor:'#0891B2', borderWidth:1.5, borderRadius:3, yAxisID:'y' },
          { label:'L2R%',    data:trendData.map(d=>parseFloat(d.l2r.toFixed(2))), type:'line', borderColor:'#F5A623', backgroundColor:'transparent', borderWidth:2.5, pointRadius:5, pointBackgroundColor:'#F5A623', yAxisID:'y2', tension:.3 },
        ]
      },
      options:{
        responsive:true, maintainAspectRatio:false,
        interaction:{mode:'index',intersect:false},
        plugins:{
          legend:{position:'top',labels:{boxWidth:10,boxHeight:10,font:{size:10,family:'DM Mono,monospace'},color:'#475569'}},
          tooltip:{backgroundColor:'rgba(11,22,41,.92)',titleColor:'#DBEAFE',bodyColor:'#93C5FD',padding:10,cornerRadius:8},
        },
        scales:{
          x:{grid:{color:'rgba(100,116,139,.1)'},ticks:{color:'#475569',font:{size:10}}},
          y:{grid:{color:'rgba(100,116,139,.1)'},ticks:{color:'#475569',font:{size:10}},position:'left',beginAtZero:true,title:{display:true,text:'Volume',color:'#94a3b8',font:{size:9}}},
          y2:{position:'right',ticks:{color:'#F5A623',font:{size:10},callback:v=>v+'%'},grid:{display:false},title:{display:true,text:'L2R%',color:'#F5A623',font:{size:9}},beginAtZero:true},
        }
      }
    });
    return () => { try { if(chartInst.current) chartInst.current.destroy(); } catch(e){} };
  }, [trendData]);

  const KPIs = [
    { label:'Total Leads',        value:Nf(totals.l),                      sub:'All sources',             color:'#003087' },
    { label:'Total Retails',      value:Nf(totals.r),                      sub:'Converted',               color:'#0891B2' },
    { label:'L2R %',              value:totals.l2r.toFixed(1)+'%',         sub:'Retails ÷ Leads',         color:'#F5A623' },
    { label:'Paid L2R%',          value:totals.pL2r.toFixed(1)+'%',        sub:Nf(totals.pL)+' paid leads',  color:'#7C3AED' },
    { label:'Organic L2R%',       value:totals.oL2r.toFixed(1)+'%',        sub:Nf(totals.oL)+' organic leads', color:'#059669' },
    { label:'Retail Till Date',   value:data.retailTillDate ? formatRetailDate(data.retailTillDate) : '—', sub:'Last attribution date', color:'#0369A1' },
  ];

  return ce('div', { className:'fade-up' },
    ce('div', { style:{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(175px,1fr))',gap:10,marginBottom:20} },
      KPIs.map((k,i) => ce('div', { key:i, className:'kpi' },
        ce('div', { style:{position:'absolute',top:0,left:0,right:0,height:3,background:k.color,borderRadius:'12px 12px 0 0'} }),
        ce('div', { className:'kpi-label' }, k.label),
        ce('div', { className:'kpi-value'+(k.value.length>7?' kpi-long':' kpi-med'), style:{color:k.color} }, k.value),
        ce('div', { className:'kpi-sub', style:{color:k.color} }, k.sub)
      ))
    ),
    ce('div', { className:'card', style:{padding:'16px 18px',marginBottom:14} },
      ce('div', { className:'section-title' }, 'Month-wise Trend — Leads, Retails & L2R%'),
      ce('div', { style:{height:260,position:'relative'} }, ce('canvas', { ref:chartRef }))
    ),
    totals.l > 0 && ce('div', { className:'card', style:{padding:'10px 18px',marginBottom:14,borderTop:'3px solid #6366F1'} },
      ce('div', { style:{display:'flex',flexWrap:'wrap',alignItems:'stretch'} },
        ...[
          ...(data.rt_cols ? [
            { label:'DMS Retails', value:Nf(totals.dL),  color:'#7C3AED' },
            { label:'Call Out',    value:Nf(totals.coL), color:'#0891B2' },
          ] : []),
          { label:'Paid %',       value:totals.l>0?Pf(totals.pL/totals.l*100):'—', color:'#6366F1' },
          { label:'Organic %',    value:totals.l>0?Pf(totals.oL/totals.l*100):'—', color:'#059669' },
          { label:'Active Sources', value:String(srcBreak.filter(s=>s.l>0).length), color:'#475569' },
          { label:'Models',        value:String(heatData.top10.length),              color:'#475569' },
          { label:'States',        value:String(heatData.top15.length),              color:'#475569' },
        ].map((s,i) => ce('div', { key:i, style:{
          padding:'6px 16px', borderLeft:i>0?'1px solid #E2E8F0':'none',
          display:'flex', flexDirection:'column', gap:2
        }},
          ce('div',{style:{fontSize:9,fontWeight:700,color:'#94A3B8',textTransform:'uppercase',letterSpacing:'.06em',whiteSpace:'nowrap'}},s.label),
          ce('div',{style:{fontSize:15,fontWeight:700,color:s.color,fontFamily:'DM Mono,monospace'}},s.value)
        ))
      )
    ),
    ce('div', { className:'card', style:{padding:'16px 18px',marginBottom:14} },
      ce('div', { style:{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:8} },
        ce('div', { className:'section-title', style:{marginBottom:0} }, 'Source Summary'),
        ce(ExportBtn, { onClick:() => {
          const aoa=[['Source','Leads','Retails','Contrib%','L2R%']];
          for (const s of srcBreak) aoa.push([s.src,s.l,s.r,+(s.l/totals.l*100).toFixed(2),+s.l2r.toFixed(2)]);
          aoa.push(['∑ Total',totals.l,totals.r,'100.0%',+totals.l2r.toFixed(2)]);
          exportXlsx({'Source Summary':aoa},'RE_Overview_Source');
        }})
      ),
      ce('div', { className:'scroll-x' },
        ce('table', null,
          ce('thead', null, ce('tr', null,
            ce('th', { className:'left', style:{minWidth:140} }, 'Source'),
            ce('th', null, 'Leads'),
            ce('th', null, 'L.Contrib%'),
            ce('th', null, 'Retails'),
            ce('th', null, 'R.Contrib%'),
            ce('th', null, 'L2R%'),
          )),
          ce('tbody', null,
            ...srcBreak.map((s,i) => ce('tr', { key:i },
              ce('td', { className:'label' }, s.src),
              ce('td', null, Nf(s.l)),
              ce('td', null, totals.l > 0 ? Pf(s.l/totals.l*100) : '—'),
              ce('td', { style:{color:'#0891B2',fontWeight:700} }, Nf(s.r)),
              ce('td', null, totals.r > 0 ? Pf(s.r/totals.r*100) : '—'),
              ce('td', { style:{color:'#D97706',fontWeight:600} }, Pf(s.l2r)),
            )),
            ce('tr', { className:'total-row' },
              ce('td', { className:'label' }, '∑ Grand Total'),
              ce('td', null, Nf(totals.l)),
              ce('td', null, '100.0%'),
              ce('td', { style:{color:'#0891B2',fontWeight:700} }, Nf(totals.r)),
              ce('td', null, '100.0%'),
              ce('td', null, ce('span', { style:{color:'#D97706',fontWeight:700} }, totals.l2r.toFixed(1)+'%')),
            )
          )
        )
      )
    ),
    heatData.top10.length > 0 && ce('div', { className:'card', style:{padding:'16px 18px',marginBottom:14} },
      ce('div', { style:{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:4} },
        ce('div', { className:'section-title', style:{marginBottom:0} }, '🔥 Model × State — Lead Volume (All Models × Top 15 States)'),
        ce(ExportBtn, { onClick:() => {
          const aoa = [['Model', ...heatData.top15]];
          for (const mdl of heatData.top10) {
            aoa.push([mdl, ...heatData.top15.map(st => heatData.cell.get(mdl+'\x00'+st) || 0)]);
          }
          exportXlsx({'Model×State':aoa}, 'RE_Model_State_Heatmap');
        }})
      ),
      ce('div', { style:{fontSize:11,color:'#94A3B8',marginBottom:10} }, 'Cell shows lead count. Darker = higher volume. Month / Model / State filters apply.'),
      ce('div', { className:'scroll-x' },
        ce('table', { style:{borderCollapse:'collapse',fontSize:11,fontFamily:'DM Mono,monospace'} },
          ce('thead', null,
            ce('tr', null,
              ce('th', { style:{minWidth:130,textAlign:'left',padding:'4px 8px',background:'#F8FAFC',fontWeight:700,fontSize:11,color:'#475569',borderBottom:'2px solid #E2E8F0',position:'sticky',left:0,zIndex:1} }, 'MODEL  STATE'),
              ...heatData.top15.map(st => ce('th', { key:st, style:{
                padding:'4px 6px', background:'#F8FAFC', fontWeight:600, fontSize:10, color:'#475569',
                borderBottom:'2px solid #E2E8F0', whiteSpace:'nowrap', maxWidth:70,
                writingMode:'vertical-rl', transform:'rotate(180deg)', height:90, verticalAlign:'bottom',
              }}, st))
            )
          ),
          ce('tbody', null,
            ...heatData.top10.map((mdl, ri) => ce('tr', { key:mdl, style:{background: ri%2===0?'#fff':'#F8FAFC'} },
              ce('td', { style:{padding:'5px 8px',fontWeight:700,fontSize:11,color:'#1E293B',borderBottom:'1px solid #F1F5F9',position:'sticky',left:0,background:ri%2===0?'#fff':'#F8FAFC',zIndex:1,whiteSpace:'nowrap'} }, mdl),
              ...heatData.top15.map(st => {
                const v = heatData.cell.get(mdl+'\x00'+st) || 0;
                const intensity = v / heatData.maxV;
                const bg = v === 0 ? '#F8FAFC' : `rgba(0,48,135,${0.08 + intensity * 0.82})`;
                const color = intensity > 0.55 ? '#fff' : '#1E293B';
                return ce('td', { key:st, style:{
                  padding:'5px 8px', textAlign:'right', borderBottom:'1px solid #F1F5F9',
                  background:bg, color, fontWeight: intensity > 0.3 ? 700 : 400,
                  minWidth:60, transition:'background 200ms',
                }}, v > 0 ? Nf(v) : '—');
              })
            ))
          )
        )
      )
    ),

    heatDataRetail.top10.length > 0 && ce('div', { className:'card', style:{padding:'16px 18px',marginBottom:14} },
      ce('div', { style:{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:4} },
        ce('div', { className:'section-title', style:{marginBottom:0} }, '🛒 Model × State — Retail Volume (All Models × Top 15 States)'),
        ce(ExportBtn, { onClick:() => {
          const aoa = [['Model', ...heatDataRetail.top15]];
          for (const mdl of heatDataRetail.top10) {
            aoa.push([mdl, ...heatDataRetail.top15.map(st => heatDataRetail.cell.get(mdl+'\x00'+st) || 0)]);
          }
          exportXlsx({'Model×State Retail':aoa}, 'RE_Model_State_Retail_Heatmap');
        }})
      ),
      ce('div', { style:{fontSize:11,color:'#94A3B8',marginBottom:10} },
        (filters.purMdls && filters.purMdls.size > 0)
          ? 'Cell shows retail by PURCHASED MODEL × State. Purch. Model / Month / State filters apply.'
          : 'Cell shows retail count. Darker = higher volume. Month / Model / State filters apply.'
      ),
      ce('div', { className:'scroll-x' },
        ce('table', { style:{borderCollapse:'collapse',fontSize:11,fontFamily:'DM Mono,monospace'} },
          ce('thead', null,
            ce('tr', null,
              ce('th', { style:{minWidth:130,textAlign:'left',padding:'4px 8px',background:'#F8FAFC',fontWeight:700,fontSize:11,color:'#475569',borderBottom:'2px solid #E2E8F0',position:'sticky',left:0,zIndex:1} }, 'MODEL  STATE'),
              ...heatDataRetail.top15.map(st => ce('th', { key:st, style:{
                padding:'4px 6px', background:'#F8FAFC', fontWeight:600, fontSize:10, color:'#475569',
                borderBottom:'2px solid #E2E8F0', whiteSpace:'nowrap', maxWidth:70,
                writingMode:'vertical-rl', transform:'rotate(180deg)', height:90, verticalAlign:'bottom',
              }}, st))
            )
          ),
          ce('tbody', null,
            ...heatDataRetail.top10.map((mdl, ri) => ce('tr', { key:mdl, style:{background: ri%2===0?'#fff':'#F8FAFC'} },
              ce('td', { style:{padding:'5px 8px',fontWeight:700,fontSize:11,color:'#1E293B',borderBottom:'1px solid #F1F5F9',position:'sticky',left:0,background:ri%2===0?'#fff':'#F8FAFC',zIndex:1,whiteSpace:'nowrap'} }, mdl),
              ...heatDataRetail.top15.map(st => {
                const v = heatDataRetail.cell.get(mdl+'\x00'+st) || 0;
                const intensity = v / heatDataRetail.maxV;
                const bg = v === 0 ? '#F8FAFC' : `rgba(8,145,178,${0.08 + intensity * 0.82})`;
                const color = intensity > 0.55 ? '#fff' : '#1E293B';
                return ce('td', { key:st, style:{
                  padding:'5px 8px', textAlign:'right', borderBottom:'1px solid #F1F5F9',
                  background:bg, color, fontWeight: intensity > 0.3 ? 700 : 400,
                  minWidth:60, transition:'background 200ms',
                }}, v > 0 ? Nf(v) : '—');
              })
            ))
          )
        )
      )
    )
  );
});

/* ════════════════════════════════════════════════════════════════════
   SOURCE ANALYSIS TAB
   ════════════════════════════════════════════════════════════════════ */
const ENQUIRY_CAT = new Set(['Direct Push', 'L1 Nurtured']);
const SourceTab = React.memo(function SourceTab({ data, rawData, filters, months, RT, onDetailedCsv, nsRetailRows, rawJoined }) {
  const { maps, sm, univ: univRaw, csm: csmRaw } = data;
  const univ = univRaw || [];
  const csm  = csmRaw  || [];
  const pmsm = data.pmsm || [];
  const pm_csm = data.pm_csm || [];
  const getLR = useMemo(() => makeLR(data.rt_cols, RT), [data.rt_cols, RT]);
  const hasCityF = !!(filters.cities && filters.cities.size > 0 && maps.city);
  // Lead-month matrices: always the pre-swap (On Create) data so Leads column reflects lead month
  const leadData = rawData || data;
  const smLead   = leadData.sm   || sm;
  const univLead = leadData.univ || univ;
  const csmLead  = leadData.csm  || csm;

  const renderMonth = useCallback((M) => {
    const allS = !filters.sources || filters.sources.size === 0;
    const allPurMdl = !filters.purMdls || filters.purMdls.size === 0;
    const univF = makeUnivFilter(filters);
    const bySrc = new Map();
    let gL=0, gR=0;
    // Pass 1: Leads (L) — always lead-month matrices so Leads attribution never shifts with booking month
    if (univF) {
      for (const row of univLead) {
        if (maps.lm[row[4]] !== M) continue;

        gL+=l;
        const c = bySrc.get(src)||[0,0]; c[0]+=l; bySrc.set(src,c);

    if (allPurMdl) {

    // Pass 3: Non-Scope Retail (NR) — iterate nsRetailRows, filter by invoiceMonth + active filters
    const nsRows = nsRetailRows || [];

    const sorted = [...bySrc.entries()].sort((a,b)=>b[1][0]-a[1][0]);
    return { l:gL, r:gR, l2r:gL>0?gR/gL*100:0, sorted, nrBySrc:nrBySrc2, gNR:gNR2, enqBySrc:enqBySrc2, gEnq:gEnq2 };
  }, [sm, csm, univ, pmsm, pm_csm, smLead, univLead, csmLead, maps, filters, getLR, hasCityF, months, nsRetailRows, rawJoined]);

  return ce('div', {className:'fade-up'},

/* ════════════════════════════════════════════════════════════════════
   WEB ID TAB  (Direct Push / L1 Nurtured dimension)
   ════════════════════════════════════════════════════════════════════ */
const PivotTab = React.memo(function PivotTab({ data, filters, months, RT, onDetailedCsv, rawJoined, leadsMode }) {
  const { maps } = data;
  const COL_SEP = '\x00';

  const [rowDims,    setRowDims]    = useState(['mdl']);
  const [colDims,    setColDims]    = useState(['lm']);
  const [metrics,    setMetrics]    = useState(['leads']);
  const [sortBy,     setSortBy]     = useState('__total__');
  const [sortDir,    setSortDir]    = useState('desc');
  const [topN,       setTopN]       = useState(20);
  const [collapsed,  setCollapsed]  = useState(new Set());
  const [addRowOpen, setAddRowOpen] = useState(false);
  const [addColOpen, setAddColOpen] = useState(false);

  // QA ref: always holds the latest state for window.heroPivotQA()
  const _pivotQARef = useRef({});

  const DIMS = [
    { key:'lm',   label:'Month'     },
    { key:'mdl',  label:'Model'     },
    { key:'src',  label:'Source'    },
    { key:'st',   label:'State'     },
    { key:'lt',   label:'Lead Type' },
    { key:'city', label:'City'      },
  ];

  const METRICS = [
    { key:'leads',  label:'Leads'    },
    { key:'leadpct', label:'L.Contrib%' },
    { key:'ret',    label:'Retails'  },
    { key:'retlpct', label:'R.Contrib%' },
    { key:'retpct', label:'Retail %' },
    { key:'dms',    label:'DMS'      },
    { key:'call',   label:'Call-Out' },
  ];


  function getRetVal(vals) {
    if (!vals) return 0;
    if (RT === 'dms') return vals[2] || 0;
    if (RT === 'co')  return vals[3] || 0;
    return vals[1] || 0;
  }

  function getMetricVal(vals, m) {
    if (!vals) return 0;
    if (m === 'leads')  return vals[0] || 0;
    if (m === 'ret')    return getRetVal(vals);
    if (m === 'retpct') return vals[0] > 0 ? (getRetVal(vals) / vals[0]) * 100 : 0;
    if (m === 'dms')    return vals[2] || 0;
    if (m === 'call')   return vals[3] || 0;
    return 0;
  }

  function fmtV(vals, m) {
    if (m === 'leadpct') {
      const l = vals ? (vals[0]||0) : 0;
      return (grandTotals.gl > 0 && l > 0) ? (l/grandTotals.gl*100).toFixed(1)+'%' : '—';
    }
    if (m === 'retlpct') {
      const r = vals ? (vals[1]||0) : 0;
      return (grandTotals.gr > 0 && r > 0) ? (r/grandTotals.gr*100).toFixed(1)+'%' : '—';
    }
    const v = getMetricVal(vals, m);
    if (m === 'retpct') return v > 0 ? v.toFixed(1) + '%' : '—';
    return v === 0 ? '—' : v.toLocaleString();
  }

  function rowTotal(cMap, m) {
    let tl = 0, tr = 0;
    for (const v of cMap.values()) { tl += v[0]; tr += v[1]; }
    if (m === 'retpct') return tl > 0 ? (tr / tl) * 100 : 0;
    let t = 0;
    for (const v of cMap.values()) t += getMetricVal(v, m);
    return t;
  }

  function fmtTotal(cMap, m) {
    if (m === 'leadpct') {
      let tl=0; for (const v of cMap.values()) tl+=v[0]||0;
      return (grandTotals.gl>0&&tl>0)?(tl/grandTotals.gl*100).toFixed(1)+'%':'—';
    }
    if (m === 'retlpct') {
      let tr=0; for (const v of cMap.values()) tr+=v[1]||0;
      return (grandTotals.gr>0&&tr>0)?(tr/grandTotals.gr*100).toFixed(1)+'%':'—';
    }
    const v = rowTotal(cMap, m);
    if (m === 'retpct') return v > 0 ? v.toFixed(1) + '%' : '—';
    return v === 0 ? '—' : v.toLocaleString();
  }

  function accVals(tgt, cKey, row, nDims) {
    if (!tgt.has(cKey)) tgt.set(cKey, [0, 0, 0, 0]);
    const c = tgt.get(cKey);
    c[0] += row[nDims]     || 0;
    c[1] += row[nDims + 1] || 0;
    c[2] += row[nDims + 2] || 0;
    c[3] += row[nDims + 3] || 0;
  }

  const pivotResult = useMemo(() => {
    if (!rawJoined || rawJoined.length === 0) return null;
    const { months:mf, sources:sf, leadTypes:ltf, models:mdf, states:stf, cities:cf, purMdls:pmf } = filters;
    const allM      = !mf  || mf.size  === 0 || mf  === FILTER_CLEARED;
    const allS      = !sf  || sf.size  === 0 || sf  === FILTER_CLEARED;
    const allLT     = !ltf || ltf.size === 0 || ltf === FILTER_CLEARED;
    const allMdl    = !mdf || mdf.size === 0 || mdf === FILTER_CLEARED;
    const allSt     = !stf || stf.size === 0 || stf === FILTER_CLEARED;
    const allC      = !cf  || cf.size  === 0 || cf  === FILTER_CLEARED;
    const allPurMdl = !pmf || pmf.size === 0 || pmf === FILTER_CLEARED;
    const getDimVal = (dim, r, effMonth) => {
      switch(dim) {
        case 'mdl':  return r.model   || 'Unknown';
        case 'src':  return r.source  || 'Unknown';
        case 'lm':   return effMonth  || 'Unknown';
        case 'st':   return r.state   || 'Unknown';
        case 'lt':   return r.lt      || 'Unknown';
        case 'city': return r.city    || 'Unknown';
        default:     return '?';
      }
    };
    const tbl    = new Map();
    const colSet = new Set();
    for (const r of rawJoined) {
      const effMonth = (leadsMode === 'update' && r.isBooked && r.booking_month) ? r.booking_month : r.lead_month;
      if (!allM   && !mf.has(effMonth))   continue;
      if (!allS   && !sf.has(r.source))   continue;
      if (!allLT  && !ltf.has(r.lt))      continue;
      if (!allMdl && !mdf.has(r.model))   continue;
      if (!allSt  && !stf.has(r.state))   continue;
      if (!allC   && !cf.has(r.city))     continue;
      const L  = 1;
      const isR = isRetailedLead(r);
      const purOk = allPurMdl || !isR || pmf.has(canonPurMdl(r.purchasedModel||''));
      const R  = (isR && purOk) ? 1 : 0;
      const Rd = (R && r.callType === 'dms') ? 1 : 0;
      const Rc = (R && r.callType === 'co')  ? 1 : 0;
      const r1 = getDimVal(rowDims[0], r, effMonth);
      const r2 = rowDims[1] ? getDimVal(rowDims[1], r, effMonth) : null;
      const c0 = getDimVal(colDims[0], r, effMonth);
      const ck = colDims[1] ? c0 + COL_SEP + getDimVal(colDims[1], r, effMonth) : c0;
      colSet.add(ck);
      if (!tbl.has(r1)) tbl.set(r1, { sub: new Map(), children: new Map() });
      const e = tbl.get(r1);
      if (!e.sub.has(ck)) e.sub.set(ck, [0, 0, 0, 0]);
      const sv = e.sub.get(ck); sv[0]+=L; sv[1]+=R; sv[2]+=Rd; sv[3]+=Rc;
      if (r2 !== null) {
        if (!e.children.has(r2)) e.children.set(r2, new Map());
        const cm = e.children.get(r2);
        if (!cm.has(ck)) cm.set(ck, [0, 0, 0, 0]);
        const cv = cm.get(ck); cv[0]+=L; cv[1]+=R; cv[2]+=Rd; cv[3]+=Rc;
      }
    }
    return { tbl, colLabels: [...colSet] };
  }, [rawJoined, rowDims, colDims, filters, leadsMode]);

  const pm = metrics[0] || 'leads';

  // Keep QA ref current every render (useRef is mutable — no deps list needed)
  _pivotQARef.current = { rawJoined, pivotResult, rowDims, colDims, filters, leadsMode, RT };

  useEffect(() => {
    window.heroPivotQA = function() {
      const q = _pivotQARef.current;
      const { rawJoined: rj, pivotResult: pr, rowDims: rd, colDims: cd, filters: f, leadsMode: lm, RT: rt } = q;
      console.group('[ATHER PIVOT QA]');

      // 1. Records available
      console.log('1. rawJoined records available to Pivot:', rj ? rj.length : 'null/undefined');

      // 2. Available months
      const months2 = rj ? [...new Set(rj.map(r => (lm==='update'&&r.isBooked&&r.booking_month)?r.booking_month:r.lead_month))].filter(Boolean).sort((a,b)=>atherMonthOrder(a)-atherMonthOrder(b)) : [];
      console.log('2. Available months:', months2);

      // 3. Available models
      const models3 = rj ? [...new Set(rj.map(r=>r.model||'Unknown'))].sort() : [];
      console.log('3. Available models (' + models3.length + '):', models3.slice(0,10), models3.length>10?'...(first 10 shown)':'');

      // 4. Total leads
      console.log('4. Total leads in rawJoined:', rj ? rj.length : 0);

      // 5. Total retails
      const totalR = rj ? rj.filter(r=>isRetailedLead(r)).length : 0;
      console.log('5. Total retails (isRetailedLead):', totalR);

      // 6. Sample Model × Month lead aggregation
      if (rj && rj.length) {
        const sampleAgg = new Map();
        rj.slice(0, 1000).forEach(r => {
          const effM = (lm==='update'&&r.isBooked&&r.booking_month)?r.booking_month:r.lead_month;
          const k = (r.model||'Unknown') + '|' + (effM||'Unknown');
          sampleAgg.set(k, (sampleAgg.get(k)||0) + 1);
        });
        const top3 = [...sampleAgg.entries()].sort((a,b)=>b[1]-a[1]).slice(0,3);
        console.log('6. Sample Model×Month lead aggregation (from first 1000 rows):', top3.map(([k,v])=>k+'='+v).join(', '));
      }

      // 7. Sample Model × Month retail aggregation
      if (rj && rj.length) {
        const retAgg = new Map();
        rj.filter(r=>isRetailedLead(r)).slice(0,200).forEach(r => {
          const effM = (lm==='update'&&r.isBooked&&r.booking_month)?r.booking_month:r.lead_month;
          const k = (r.model||'Unknown') + '|' + (effM||'Unknown');
          retAgg.set(k, (retAgg.get(k)||0) + 1);
        });
        const top3r = [...retAgg.entries()].sort((a,b)=>b[1]-a[1]).slice(0,3);
        console.log('7. Sample Model×Month retail aggregation (from first 200 retails):', top3r.map(([k,v])=>k+'='+v).join(', ') || '(none)');
      }

      // 8. Missing/undefined fields
      if (rj && rj.length) {
        const s = rj[0];
        const missing = ['model','source','lead_month','lt','state','city'].filter(fld => s[fld]===undefined);
        console.log('8. Fields undefined in first row:', missing.length ? missing : 'none');
        console.log('   First row sample:', {model:s.model,source:s.source,lead_month:s.lead_month,lt:s.lt,state:s.state,isBooked:s.isBooked,booking_month:s.booking_month});
      }

      // 9. Pivot config non-zero check
      if (pr && pr.tbl.size > 0) {
        let accL = 0, accR = 0;
        for (const {sub} of pr.tbl.values()) for (const v of sub.values()) { accL+=v[0]; accR+=v[1]; }
        console.log('9. Current pivot config: tbl rows='+pr.tbl.size+', accumulated leads='+accL+', retails='+accR, accL>0?'✓ NON-ZERO':'⚠ ALL ZERO');
      } else {
        console.log('9. pivotResult:', pr ? 'tbl empty (size=0)' : 'null');
      }

      // 10. Renderer lookup trace (Model × Month for first model)
      if (pr && pr.tbl.size > 0 && pr.colLabels && pr.colLabels.length > 0) {
        const sampleModel = [...pr.tbl.keys()][0];
        const sampleEntry = pr.tbl.get(sampleModel);
        const sampleCol   = pr.colLabels[0];
        const sampleVals  = sampleEntry.sub.get(sampleCol);
        console.group('10. Renderer lookup trace');
        console.log('  Model:', sampleModel);
        console.log('  Col key (month):', sampleCol);
        console.log('  entry.sub.get(colKey) =', sampleVals, '  [L, R_all, R_dms, R_co]');
        const MKEYS = ['leads','leadpct','ret','retlpct','retpct','dms','call'];
        MKEYS.forEach(mk => {
          const getRetV = (v) => rt==='dms'?v[2]:rt==='co'?v[3]:v[1];
          const raw = sampleVals ? (mk==='leads'?sampleVals[0]:mk==='ret'?getRetV(sampleVals):mk==='retpct'?(sampleVals[0]>0?getRetV(sampleVals)/sampleVals[0]*100:0):mk==='dms'?sampleVals[2]:mk==='call'?sampleVals[3]:null) : 0;
          const rendered = sampleVals ? (raw===0||raw===null?'—':(mk==='retpct'?raw.toFixed(1)+'%':String(raw))) : '—';
          console.log('  metric='+mk+' → raw='+raw+' → rendered='+rendered);
        });
        // TOTAL cell lookup
        let totL=0,totR=0;
        for (const v of sampleEntry.sub.values()) { totL+=v[0]; totR+=v[1]; }
        console.log('  TOTAL leads='+totL+', retails='+totR, totL>0?'✓':'⚠ ZERO');
        console.groupEnd();
      }

      console.log('   Config: rowDims='+rd+', colDims='+cd+', leadsMode='+lm+', RT='+rt);
      console.groupEnd();
      return { rawJoinedCount: rj?rj.length:0, months:months2, modelCount:models3.length, totalLeads:rj?rj.length:0, totalRetails:totalR, pivotTblSize:pr?pr.tbl.size:0 };
    };
    return () => { delete window.heroPivotQA; };
  }, []);

  const orderedCols = useMemo(() => {
    if (!pivotResult) return [];
    const { tbl, colLabels } = pivotResult;
    if (colDims.length === 1) {
      if (colDims[0] === 'lm') return [...colLabels].sort((a, b) => atherMonthOrder(a) - atherMonthOrder(b));
      const cTot = {};
      for (const { sub } of tbl.values())
        for (const [c, v] of sub) cTot[c] = (cTot[c] || 0) + getMetricVal(v, pm);
      return [...colLabels].sort((a, b) => (cTot[b] || 0) - (cTot[a] || 0));
    }
    const groups = new Map();
    for (const ck of colLabels) {
      const sep = ck.indexOf(COL_SEP);
      const c0 = ck.slice(0, sep), c1 = ck.slice(sep + 1);
      if (!groups.has(c0)) groups.set(c0, new Set());
      groups.get(c0).add(c1);
    }
    let c0vals = [...groups.keys()];
    if (colDims[0] === 'lm') { c0vals.sort((a, b) => atherMonthOrder(a) - atherMonthOrder(b)); }
    else {
      const c0Tot = {};
      for (const { sub } of tbl.values())
        for (const [ck, v] of sub) {
          const c0 = ck.slice(0, ck.indexOf(COL_SEP));
          c0Tot[c0] = (c0Tot[c0] || 0) + getMetricVal(v, pm);
        }
      c0vals.sort((a, b) => (c0Tot[b] || 0) - (c0Tot[a] || 0));
    }
    const result = [];
    for (const c0 of c0vals) {
      let c1vals = [...groups.get(c0)];
      if (colDims[1] === 'lm') { c1vals.sort((a, b) => atherMonthOrder(a) - atherMonthOrder(b)); }
      else {
        const c1Tot = {};
        for (const { sub } of tbl.values())
          for (const [ck, v] of sub) {
            const sep = ck.indexOf(COL_SEP);
            if (ck.slice(0, sep) === c0) {
              const c1 = ck.slice(sep + 1);
              c1Tot[c1] = (c1Tot[c1] || 0) + getMetricVal(v, pm);
            }
          }
        c1vals.sort((a, b) => (c1Tot[b] || 0) - (c1Tot[a] || 0));
      }
      for (const c1 of c1vals) result.push(c0 + COL_SEP + c1);
    }
    return result;
  }, [pivotResult, colDims, pm]);

  const colGroups = useMemo(() => {
    if (colDims.length < 2) return [];
    const groups = [];
    let i = 0;
    while (i < orderedCols.length) {
      const c0 = orderedCols[i].slice(0, orderedCols[i].indexOf(COL_SEP));
      let span = 0;
      while (i < orderedCols.length && orderedCols[i].slice(0, orderedCols[i].indexOf(COL_SEP)) === c0) { span++; i++; }
      groups.push({ c0, span });
    }
    return groups;
  }, [orderedCols, colDims]);

  const sortedRows = useMemo(() => {
    if (!pivotResult) return [];
    const rows = [];
    for (const [label, entry] of pivotResult.tbl) {
      const total = rowTotal(entry.sub, pm);
      rows.push({ label, entry, total });
    }
    rows.sort((a, b) => {
      let av, bv;
      if (sortBy === '__total__') { av = a.total; bv = b.total; }
      else if (sortBy === '__label__') { av = a.label; bv = b.label; }
      else { av = getMetricVal(a.entry.sub.get(sortBy), pm); bv = getMetricVal(b.entry.sub.get(sortBy), pm); }
      if (av === bv) return 0;
      if (typeof av === 'string') return sortDir === 'asc' ? av.localeCompare(bv) : bv.localeCompare(av);
      return sortDir === 'asc' ? av - bv : bv - av;
    });
    return topN > 0 ? rows.slice(0, topN) : rows;
  }, [pivotResult, pm, sortBy, sortDir, topN]);

  const grandTotals = useMemo(() => {
    if (!pivotResult) return { colVals: {}, gl: 0, gr: 0 };
    const colVals = {};
    let gl = 0, gr = 0;
    for (const { sub } of pivotResult.tbl.values()) {
      for (const [c, v] of sub) {
        if (!colVals[c]) colVals[c] = [0, 0, 0, 0];
        for (let i = 0; i < 4; i++) colVals[c][i] += v[i];
        gl += v[0]; gr += v[1];
      }
    }
    return { colVals, gl, gr };
  }, [pivotResult]);

  const unapplied = [];

  function toggleMetric(key) {
    setMetrics(prev =>
      prev.includes(key)
        ? prev.length > 1 ? prev.filter(k => k !== key) : prev
        : [...prev, key]
    );
  }

  function addRowDim(key) {
    if (rowDims.includes(key) || colDims.includes(key)) return;
    setRowDims([...rowDims, key]);
    setAddRowOpen(false);
    setCollapsed(new Set());
  }

  function removeRowDim(idx) {
    if (rowDims.length === 1) return;
    setRowDims(rowDims.filter((_, i) => i !== idx));
    setCollapsed(new Set());
  }

  function addColDim(key) {
    if (colDims.includes(key) || rowDims.includes(key)) return;
    setColDims([...colDims, key]);
    setAddColOpen(false);
    setSortBy('__total__');
  }

  function removeColDim(idx) {
    if (colDims.length === 1) return;
    setColDims(colDims.filter((_, i) => i !== idx));
    setSortBy('__total__');
  }

  function handleExport() {
    if (!pivotResult || sortedRows.length === 0) return;
    const hasR2  = rowDims.length > 1;
    const hasC2  = colDims.length > 1;
    const dimLbl = k => DIMS.find(d => d.key === k)?.label || k;
    const mLbl   = k => METRICS.find(x => x.key === k)?.label || k;
    const colLabel = ck => hasC2
      ? ck.slice(0, ck.indexOf(COL_SEP)) + ' — ' + ck.slice(ck.indexOf(COL_SEP) + 1)
      : ck;
    const hdr = [dimLbl(rowDims[0])];
    if (hasR2) hdr.push(dimLbl(rowDims[1]));
    for (const ck of orderedCols)
      for (const m of metrics)
        hdr.push(metrics.length > 1 ? `${colLabel(ck)} — ${mLbl(m)}` : colLabel(ck));
    for (const m of metrics)
      hdr.push(metrics.length > 1 ? `TOTAL — ${mLbl(m)}` : 'TOTAL');
    const aoa = [hdr];
    const pushCells = (arr, cMap) => {
      for (const ck of orderedCols)
        for (const m of metrics) {
          const v = getMetricVal(cMap.get(ck), m);
          arr.push(m === 'retpct' ? +(v.toFixed(2)) : v);
        }
      for (const m of metrics) {
        const t = rowTotal(cMap, m);
        arr.push(m === 'retpct' ? +(t.toFixed(2)) : t);
      }
    };
    for (const { label, entry } of sortedRows) {
      if (!hasR2) { const r = [label]; pushCells(r, entry.sub); aoa.push(r); }
      else {
        const rSub = [label, 'Subtotal']; pushCells(rSub, entry.sub); aoa.push(rSub);
        for (const [r2Lbl, cMap] of entry.children) {
          const rChild = ['', r2Lbl]; pushCells(rChild, cMap); aoa.push(rChild);
        }
      }
    }
    const gtRow = hasR2 ? ['GRAND TOTAL', ''] : ['GRAND TOTAL'];
    for (const ck of orderedCols)
      for (const m of metrics) {
        const v = getMetricVal(grandTotals.colVals[ck], m);
        gtRow.push(m === 'retpct' ? +(v.toFixed(2)) : v);
      }
    for (const m of metrics) {
      let t = 0;
      if (m === 'retpct') t = grandTotals.gl > 0 ? +(grandTotals.gr/grandTotals.gl*100).toFixed(2) : 0;
      else { for (const { sub } of pivotResult.tbl.values()) for (const v of sub.values()) t += getMetricVal(v, m); t = +t.toFixed(2); }
      gtRow.push(t);
    }
    aoa.push(gtRow);
    exportCsv(aoa, `Hero_Pivot_${Date.now()}.csv`);
  }

  const activeMetrics = METRICS.filter(x => metrics.includes(x.key));
  const hasR2       = rowDims.length > 1;
  const hasC2       = colDims.length > 1;
  const multiMetric = activeMetrics.length > 1;
  const allDims     = [...rowDims, ...colDims];
  const unsupported      = new Set(allDims).size < allDims.length;
  const awaitingPipeline = !unsupported && (!rawJoined || rawJoined.length === 0);
  const noData           = !unsupported && !awaitingPipeline && (!pivotResult || pivotResult.tbl.size === 0);

  const selSt = { padding:'6px 10px', fontSize:13, border:'1px solid #CBD5E1', borderRadius:8,
                  background:'#fff', color:'#0f172a', fontFamily:'inherit', cursor:'pointer' };

  const makePill = (dim, onRemove, canRemove) => {
    const label = DIMS.find(d => d.key === dim)?.label || dim;
    return ce('span', { key: dim,
      style:{ display:'inline-flex', alignItems:'center', gap:3, padding:'4px 10px',
              borderRadius:20, fontSize:12, fontWeight:600, background:'#164E63', color:'#fff' }
    },
      label,
      canRemove && ce('span', {
        onClick: e => { e.stopPropagation(); onRemove(); },
        style:{ marginLeft:2, cursor:'pointer', opacity:0.75, fontSize:15, lineHeight:1 }
      }, '×')
    );
  };

  const addPillBtn = onClick =>
    ce('button', { onClick,
      style:{ padding:'4px 10px', borderRadius:20, fontSize:12, fontWeight:600,
              cursor:'pointer', border:'1.5px dashed #94A3B8',
              background:'#fff', color:'#64748B' }
    }, '+ Add');

  const dimDropdown = (items, onSelect) =>
    ce('div', { style:{ position:'absolute', top:'calc(100% + 4px)', left:0, zIndex:20,
        background:'#fff', border:'1px solid #E2E8F0', borderRadius:8,
        boxShadow:'0 4px 16px rgba(0,0,0,0.12)', minWidth:140, overflow:'hidden' } },
      items.map(d => ce('div', {
        key: d.key, onClick: () => onSelect(d.key),
        style:{ padding:'8px 14px', fontSize:13, cursor:'pointer', color:'#0f172a' },
        onMouseEnter: e => e.currentTarget.style.background = '#F1F5F9',
        onMouseLeave: e => e.currentTarget.style.background = '',
      }, d.label))
    );

  const metricPill = m => {
    const active = metrics.includes(m.key);
    return ce('span', { key: m.key, onClick: () => toggleMetric(m.key),
      style:{ display:'inline-flex', alignItems:'center', padding:'4px 10px',
              borderRadius:20, fontSize:12, fontWeight:600, cursor:'pointer', userSelect:'none',
              border: active ? '1.5px solid #164E63' : '1.5px solid #CBD5E1',
              background: active ? '#164E63' : '#fff',
              color: active ? '#fff' : '#475569' }
    }, m.label);
  };

  return ce('div', { style:{ padding:'0 4px' } },

    /* Config bar */
    ce('div', { style:{ display:'flex', gap:14, flexWrap:'wrap', alignItems:'flex-start',
        padding:'16px 18px', background:'#F8FAFC', borderRadius:12,
        border:'1px solid #E2E8F0', marginBottom:14 } },

      /* ROWS */
      ce('div', { style:{ minWidth:80 } },
        ce('div', { style:{fontSize:10,fontWeight:700,color:'#64748B',textTransform:'uppercase',letterSpacing:'0.08em',marginBottom:6} }, 'Rows'),
        ce('div', { style:{ display:'flex', gap:6, flexWrap:'wrap', alignItems:'center' } },
          rowDims.map((dim, idx) => makePill(dim, () => removeRowDim(idx), rowDims.length > 1)),
          rowDims.length < 2 &&
            ce('div', { style:{ position:'relative' } },
              addPillBtn(() => setAddRowOpen(o => !o)),
              addRowOpen && dimDropdown(
                DIMS.filter(d => !rowDims.includes(d.key) && !colDims.includes(d.key)),
                addRowDim
              )
            )
        )
      ),

      ce('div', { style:{color:'#CBD5E1',fontSize:22,alignSelf:'center',fontWeight:300,paddingTop:18} }, '×'),

      /* COLUMNS */
      ce('div', { style:{ minWidth:80 } },
        ce('div', { style:{fontSize:10,fontWeight:700,color:'#64748B',textTransform:'uppercase',letterSpacing:'0.08em',marginBottom:6} }, 'Columns'),
        ce('div', { style:{ display:'flex', gap:6, flexWrap:'wrap', alignItems:'center' } },
          colDims.map((dim, idx) => makePill(dim, () => removeColDim(idx), colDims.length > 1)),
          colDims.length < 2 &&
            ce('div', { style:{ position:'relative' } },
              addPillBtn(() => setAddColOpen(o => !o)),
              addColOpen && dimDropdown(
                DIMS.filter(d => !colDims.includes(d.key) && !rowDims.includes(d.key)),
                addColDim
              )
            )
        )
      ),

      ce('div', { style:{width:1,height:40,background:'#E2E8F0',alignSelf:'center',marginTop:20} }),

      /* VALUES */
      ce('div', null,
        ce('div', { style:{fontSize:10,fontWeight:700,color:'#64748B',textTransform:'uppercase',letterSpacing:'0.08em',marginBottom:6} }, 'Values'),
        ce('div', { style:{ display:'flex', gap:6, flexWrap:'wrap' } },
          METRICS.map(metricPill)
        )
      ),

      ce('div', { style:{width:1,height:40,background:'#E2E8F0',alignSelf:'center',marginTop:20} }),

      /* SORT */
      ce('div', null,
        ce('div', { style:{fontSize:10,fontWeight:700,color:'#64748B',textTransform:'uppercase',letterSpacing:'0.08em',marginBottom:6} }, 'Sort By'),
        ce('select', { value:sortBy, onChange:e=>setSortBy(e.target.value), style:selSt },
          ce('option',{value:'__total__'},'Total'),
          ce('option',{value:'__label__'},'Row Label'),

                }, hasCh ? (isCol?'▶ ':'▼ ')+label : label),

                activeMetrics.map((m,mi) => ce('td',{ key:`tot_${label}_${m.key}`,
                  style:{padding:'7px 12px',textAlign:'right',fontWeight:700,background:'#FEF3C7',

                  fmtTotal(entry.sub, m.key)))
              ),
              ...(hasCh && !isCol
                ? [...entry.children.entries()].map(([r2Lbl, cMap]) =>
                    ce('tr', { key:`r2_${label}_${r2Lbl}`, style:{ background:'#FFFBEB' } },
                      ce('td',{style:{padding:'6px 16px 6px 28px',color:'#6B7280',position:'sticky',left:0,zIndex:1,background:'#FFFBEB',borderRight:'1px solid #E2E8F0'}},''),
                      ce('td',{style:{padding:'6px 12px',color:'#374151',fontSize:12,borderRight:'1px solid #E2E8F0',whiteSpace:'nowrap'}},r2Lbl),
                      orderedCols.flatMap((ck,ci) =>
                        activeMetrics.map((m,mi) => ce('td',{ key:`c2_${r2Lbl}_${ck}_${m.key}`,
                          style:{padding:'6px 12px',textAlign:'right',fontSize:12,whiteSpace:'nowrap',
                                 borderLeft:(mi===0&&ci===0)?'none':(mi===0)?'1px solid #F1F5F9':'none'} },
                          fmtV(cMap.get(ck), m.key)))
                      ),
                      activeMetrics.map((m,mi) => ce('td',{ key:`c2tot_${r2Lbl}_${m.key}`,
                        style:{padding:'6px 12px',textAlign:'right',fontWeight:600,fontSize:12,background:'#FEF3C7',
                               borderLeft:mi===0?'2px solid #F59E0B':'none'} },
                        fmtTotal(cMap, m.key)))
                    )
                  )
                : []
              )
            ];
          }).flat(),

          /* Grand total row */
          ce('tr', { className:'total-row' },
            ce('td', { colSpan: rowDims.length,
              style:{ padding:'8px 16px', fontWeight:800, position:'sticky', left:0, zIndex:1,
                      background:'#1E293B', color:'#fff', whiteSpace:'nowrap',
                      borderRight:'1px solid rgba(255,255,255,.2)' }
            }, '∑ Grand Total'),
            orderedCols.flatMap((ck,ci) =>
              activeMetrics.map((m,mi) => {
                const v = getMetricVal(grandTotals.colVals[ck], m.key);
                return ce('td',{ key:`gt_${ck}_${m.key}`,
                  style:{padding:'8px 12px',textAlign:'right',fontWeight:700,fontFamily:'DM Mono,monospace',fontSize:12,
                         borderLeft:(mi===0&&ci===0)?'none':(mi===0)?'1px solid rgba(255,255,255,.15)':'none'} },
                  (m.key==='retpct'||m.key==='leadpct'||m.key==='retlpct')?(v>0?v.toFixed(1)+'%':'—'):v===0?'—':Nf(v));
              })
            ),
            activeMetrics.map((m,mi) => {
              let t = 0;
              if (m.key==='retpct') t = grandTotals.gl>0?(grandTotals.gr/grandTotals.gl*100):0;
              else if (m.key==='leadpct') t = 100;
              else if (m.key==='retlpct') t = 100;
              else for (const {sub} of pivotResult.tbl.values()) for (const v of sub.values()) t += getMetricVal(v,m.key);
              return ce('td',{ key:`gttot_${m.key}`,
                style:{padding:'8px 12px',textAlign:'right',fontWeight:800,fontFamily:'DM Mono,monospace',fontSize:12,
                       background:'#0F172A',borderLeft:mi===0?'2px solid rgba(255,255,255,.3)':'none'} },
                (m.key==='retpct'||m.key==='leadpct'||m.key==='retlpct')?(t>0?t.toFixed(1)+'%':'—'):t===0?'—':Nf(t));
            })
          )
        )
      )
    )
  );
});

];

  const incFont=useCallback(()=>setFontScale(s=>{const i=FONT_STEPS.indexOf(+s.toFixed(2));return i<FONT_STEPS.length-1?FONT_STEPS[i+1]:s;}),[]);

  const handleSync=useCallback(async()=>{
    setSyncing(true);setSyncErr(null);
    try{
      const monthEntries=Object.entries(ATHER_LEAD_MASTER_BY_MONTH);
      if(!monthEntries.length)throw new Error('No Lead Master sheets configured in ATHER_LEAD_MASTER_BY_MONTH.');

        Promise.all(monthEntries.map(([,url])=>fetchSheetCsv(url))),

        ld.sampleDateValues.forEach(x=>console.log('[ATHER QA] Lead date sample: raw="'+x.raw+'" → '+(x.parsed||'UNPARSEABLE')));

  return _fbApp;

function getFbAuth(){return firebase.auth(getFirebase());}
function getFbDb(){return firebase.firestore(getFirebase());}
function getFbRTDB(){
  try{return firebase.database(getFirebase());}
  catch(e){console.warn('[ATHER AUTH] Realtime Database not configured — presence disabled');return null;}
}

function isAdminEmail(email){return ADMIN_EMAILS.includes((email||'').toLowerCase());}
function ensureUserDoc(user){
  var ref=getFbDb().collection(USERS_COL).doc(user.uid);
  var isAdmin=isAdminEmail(user.email);
  return ref.get().then(function(snap){
    if(!snap.exists){
      return ref.set({email:user.email,displayName:user.displayName||user.email,photoURL:user.photoURL||'',
        role:isAdmin?'admin':'pending',createdAt:firebase.firestore.FieldValue.serverTimestamp()});
    }
    var updates={};
    if(snap.data().email!==user.email)Object.assign(updates,{email:user.email,displayName:user.displayName||user.email,photoURL:user.photoURL||''});
    if(isAdmin&&snap.data().role!=='admin')updates.role='admin';
    if(Object.keys(updates).length)return ref.update(updates);
  });
}
function setupPresence(user){
  var rtdb=getFbRTDB();
  if(!rtdb)return null;
  var presRef=rtdb.ref(PRESENCE_PATH+'/'+user.uid);
  presRef.set({uid:user.uid,email:user.email,name:user.displayName||user.email,photo:user.photoURL||'',ts:firebase.database.ServerValue.TIMESTAMP});
  presRef.onDisconnect().remove();
  return presRef;
}

function PresenceStrip({presence,fbUser,role,onSignOut,onAdminOpen}){
  var pArr=Object.values(presence||{});
  var others=pArr.filter(function(p){return p.uid!==fbUser.uid;});
  var selfPres=pArr.find(function(p){return p.uid===fbUser.uid;})||{name:fbUser.displayName,photo:fbUser.photoURL,email:fbUser.email,uid:fbUser.uid};
  var COLORS=['#2563eb','#16a34a','#d97706','#7c3aed','#db2777','#0891b2','#ea580c','#0d9488'];
  function colorFor(uid){return COLORS[((uid||'').charCodeAt(0)+((uid||'').charCodeAt(1)||0))%COLORS.length]||COLORS[0];}
  function initials(n){return((n||'?').split(' ').map(function(w){return w[0]||'';}).join('').slice(0,2)||'?').toUpperCase();}
  function Av(p,highlight){
    return ce('div',{key:p.uid,className:'avatar',style:{background:colorFor(p.uid),border:highlight?'2px solid #FDBA74':'2px solid rgba(255,255,255,.4)'},title:p.name||p.email},
      ce('div',{className:'avatar-tip'},p.name||p.email),
      p.photo?ce('img',{src:p.photo,style:{width:'100%',height:'100%',borderRadius:'50%',objectFit:'cover'},alt:''}):initials(p.name||p.email)
    );
  }
  return ce('div',{className:'presence-strip'},
    others.length>0&&ce('div',{style:{display:'flex',alignItems:'center',gap:2,marginRight:4}},
      ce('span',{style:{fontSize:8,color:'rgba(255,255,255,.6)',textTransform:'uppercase',letterSpacing:'.07em',marginRight:4}},'Live:'),
      others.slice(0,6).map(function(p){return Av(p,false);}),
      others.length>6&&ce('div',{className:'avatar',style:{background:'rgba(255,255,255,.25)',fontSize:9,color:'#fff'}},'+' +(others.length-6))
    ),
    Av(selfPres,true),
    (role==='admin'||role==='full')&&ce('span',{className:'viewer-badge',style:{background:'rgba(255,255,255,.15)',color:'#A5F3FC',borderRadius:20,padding:'2px 8px',fontSize:9,fontWeight:700,letterSpacing:'.06em',textTransform:'uppercase',marginLeft:4}},role==='admin'?'Admin':'Full'),
    role==='viewer'&&ce('span',{className:'viewer-badge',style:{marginLeft:4}},'Viewer'),
    role==='client'&&ce('span',{className:'viewer-badge',style:{background:'#ccfbf1',color:'#0d9488',marginLeft:4}},'Client'),
    role==='admin'&&ce('button',{
      style:{marginLeft:6,padding:'4px 10px',borderRadius:6,border:'1px solid rgba(255,255,255,.3)',background:'rgba(255,255,255,.12)',fontSize:11,cursor:'pointer',color:'#fff',fontWeight:600,fontFamily:'inherit',whiteSpace:'nowrap'},
      onClick:onAdminOpen},'\u2699 Admin'),
    ce('button',{
      style:{marginLeft:4,padding:'4px 10px',borderRadius:6,border:'1px solid rgba(255,255,255,.3)',background:'rgba(255,255,255,.1)',fontSize:11,cursor:'pointer',color:'rgba(255,255,255,.85)',fontFamily:'inherit',whiteSpace:'nowrap'},
      onClick:onSignOut},'Sign Out')
  );
}

  var[panelErr,setPanelErr]=useState('');

  },[]);

      .then(function(){setSaving(null);})

      ce('div',{style:{overflowX:'auto'}},

          ce('thead',null,ce('tr',{style:{background:'#fff7ed'}},

              ce('td',{style:{padding:'7px 10px',color:'#6b7280',fontSize:11,maxWidth:220,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}},u.email),
              ce('td',{style:{padding:'7px 10px',color:'#374151',fontSize:11}},u.displayName||'\u2014'),
              ce('td',{style:{padding:'7px 10px'}},
                ce('span',{style:{padding:'2px 8px',borderRadius:20,fontSize:10,fontWeight:700,background:roleBg[u.role]||roleBg.pending,color:roleColor[u.role]||roleColor.pending}},u.role||'pending')
              ),
              ce('td',{style:{padding:'7px 10px'}},
                isAdminEmail(u.email)
                  ?ce('span',{style:{fontSize:11,color:'#9ca3af'}},'\u2014')
                  :saving===u.id
                    ?ce('span',{style:{fontSize:11,color:'#9ca3af'}},'Saving\u2026')
                    :ce('select',{value:u.role||'pending',onChange:function(e){changeRole(u.id,e.target.value);},
                        style:{fontSize:11,padding:'3px 8px',borderRadius:6,border:'1px solid #d1d5db',cursor:'pointer',background:'#fff',fontFamily:'inherit'}},

}

function AuthGate(){
  var[authState,setAuthState]=useState('loading');
  var[fbUser,setFbUser]=useState(null);
  var[role,setRole]=useState(null);
  var[presence,setPresence]=useState({});
  var[authErr,setAuthErr]=useState('');
  var[authLoading,setAuthLoading]=useState(false);
  var[showAdmin,setShowAdmin]=useState(false);
  var cleanups=React.useRef([]);
  var handledUid=React.useRef(null); // dedup: track last handled uid

  useEffect(function(){
    var auth=getFbAuth();
    var mounted=true;

    function teardown(){
      cleanups.current.forEach(function(f){try{f();}catch(e){}});
      cleanups.current=[];
    }

    function handleUser(user){
      if(!mounted)return;
      if(!user){
        teardown();
        handledUid.current=null;
        if(mounted){setAuthState('unauth');setFbUser(null);setRole(null);setPresence({});}
        return;
      }
      if(handledUid.current===user.uid){return;}
      teardown();
      handledUid.current=user.uid;
      if(mounted){setFbUser(user);setAuthState('pending');}
      ensureUserDoc(user).catch(function(e){
        console.error('[ATHER AUTH] ensureUserDoc failed:',e.code||e.message);
      });
      var presRef=setupPresence(user);
      if(presRef)cleanups.current.push(function(){try{presRef.remove();}catch(e){}});
      var unsubRole=getFbDb().collection(USERS_COL).doc(user.uid).onSnapshot(
        function(snap){
          if(mounted){
            var r=(snap.data()||{}).role||'pending';
            setRole(r);setAuthState(r==='pending'?'pending':'authed');
          }
        },
        function(e){
          if(mounted){
            var fallbackRole=isAdminEmail(user.email)?'admin':'full';
            setRole(fallbackRole);setAuthState('authed');
          }
        }
      );
      cleanups.current.push(unsubRole);
      var _rtdb=getFbRTDB();
      if(_rtdb){
        var presListenRef=_rtdb.ref(PRESENCE_PATH);
        presListenRef.on('value',function(snap){if(mounted)setPresence(snap.val()||{});});
        cleanups.current.push(function(){presListenRef.off();});
      }
    }

    var unsubAuth=auth.onAuthStateChanged(function(user){handleUser(user);});

    return function(){
      mounted=false;
      unsubAuth();
      teardown();
    };
  },[]);

  function handleLogin(){
    setAuthLoading(true);setAuthErr('');
    var provider=new firebase.auth.GoogleAuthProvider();
    provider.setCustomParameters({prompt:'select_account'});
    getFbAuth().signInWithPopup(provider)
      .catch(function(e){
        var code=e&&e.code||'';
        var msg='Sign-in error ('+code+'): '+e.message;
        if(code==='auth/popup-blocked'){msg='Pop-up was blocked by your browser. Please allow pop-ups for this site and try again.';}
        else if(code==='auth/unauthorized-domain'){msg='This domain is not authorized. Contact the administrator.';}
        setAuthErr(msg);
        setAuthLoading(false);
      });
  }
  function handleSignOut(){
    cleanups.current.forEach(function(f){try{f();}catch(e){}});
    getFbAuth().signOut();
  }

  if(authState==='loading')return ce('div',{style:{display:'flex',alignItems:'center',justifyContent:'center',height:'100vh',color:'#6b7280',fontSize:13,fontFamily:'DM Mono,monospace'}},'Authenticating\u2026');
  if(authState==='unauth')return ce(LoginPage,{onLogin:handleLogin,loading:authLoading,error:authErr});
  if(authState==='pending')return ce(PendingPage,{user:fbUser,onSignOut:handleSignOut});
  return ce(React.Fragment,null,
    showAdmin&&ce(AdminPanel,{onClose:function(){setShowAdmin(false);}}),
    ce(App,{fbUser:fbUser,role:role,presence:presence,onSignOut:handleSignOut,onAdminOpen:function(){setShowAdmin(true);}})
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(ce(AuthGate,null));
</script>
