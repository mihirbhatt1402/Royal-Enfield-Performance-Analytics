<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Ather LDR Dashboard v1.0</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Inter:wght@400;500;600;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --red:#0891B2;--red-d:#0E7490;--red-m:#06B6D4;
  --red-50:#ECFEFF;--red-100:#CFFAFE;--red-200:#A5F3FC;
  --navy:#164E63;--blue:#155E75;--blue-m:#0891B2;
  --blue-50:#ECFEFF;--blue-100:#CFFAFE;--blue-200:#A5F3FC;
  --gold:#D97706;--gold-light:#FEF3C7;
  --teal:#0891B2;--green:#0891B2;--purple:#7C3AED;
  --paid-clr:#7C3AED;--paid-light:#EDE9FE;
  --org-clr:#0891B2;--org-light:#CFFAFE;
  --dur-fast:120ms;--dur-base:200ms;
  --shadow-1:0 2px 8px rgba(0,0,0,.08),0 0 0 1px rgba(8,145,178,.10);
  --shadow-card:0 4px 16px rgba(0,0,0,.07),0 1px 3px rgba(0,0,0,.05);
  --dashboard-font-scale:1
}
body{font-family:'Inter',system-ui,sans-serif;background:#f8fafc;color:#0f172a;min-height:100vh}
.fade-up{animation:fadeUp .25s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}

/* ── KPI cards ── */
.kpi{position:relative;background:#fff;border-radius:14px;padding:16px 18px 14px;box-shadow:var(--shadow-card);overflow:hidden;border:1px solid #E2E8F0}
.kpi-label{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:#64748B;margin-bottom:6px}
.kpi-value{font-size:24px;font-weight:800;color:#0f172a;letter-spacing:-.03em;font-family:'DM Mono',monospace}
.kpi-sub{font-size:10px;color:var(--red);margin-top:4px;font-family:'DM Mono',monospace;font-weight:600}
.card{background:#fff;border-radius:14px;border:1px solid #E2E8F0;box-shadow:var(--shadow-card)}

/* ── Tab nav ── */
.tab-pill{padding:10px 22px;font-size:12px;font-weight:600;border:none;background:none;cursor:pointer;border-bottom:3px solid transparent;color:#64748B;transition:all var(--dur-fast);font-family:inherit;white-space:nowrap}
.tab-pill.active{color:var(--red-d);border-bottom-color:var(--red)}
.tab-pill:hover:not(.active){color:#0f172a;background:var(--red-50)}

/* ── Tables ── */
table{width:100%;border-collapse:collapse;font-size:11.5px}
th{padding:9px 12px;font-weight:700;font-size:9.5px;text-transform:uppercase;letter-spacing:.08em;color:#fff;background:linear-gradient(135deg,#1E3A8A 0%,#2563EB 100%);text-align:center;border:1px solid rgba(255,255,255,.15);white-space:nowrap;position:sticky;top:0;z-index:2}
th.left{text-align:left}
th.sub{background:linear-gradient(90deg,#0891B2,#06B6D4);font-size:8.5px;color:#fff;position:sticky;top:33px;z-index:1;font-weight:600;letter-spacing:.06em;border:1px solid rgba(255,255,255,.15)}
th.grp-toggle{cursor:pointer;user-select:none}
th.grp-toggle:hover{filter:brightness(.94)}
td{padding:7px 12px;border:1px solid #E2E8F0;font-size:11.5px;text-align:center;font-family:'DM Mono',monospace;background:#fff;vertical-align:middle}
td.label{text-align:left;font-family:'Inter',system-ui,sans-serif;font-weight:600;font-size:12px;color:#0f172a;background:#fff;position:sticky;left:0;z-index:1;border-right:2px solid #E2E8F0;white-space:nowrap}
td.sub-label{text-align:left;font-family:'Inter',system-ui,sans-serif;font-weight:500;font-size:11px;color:#475569;background:#FAFAFA;position:sticky;left:0;z-index:1;border-right:2px solid #E2E8F0;padding-left:28px;white-space:nowrap}
tr:hover td{background:#ECFEFF}
tr:hover td.label{background:#ECFEFF}
tr:hover td.sub-label{background:#ECFEFF}
tr.total-row td{background:linear-gradient(90deg,#164E63,#164E63);color:#fff !important;font-weight:700;border-color:rgba(255,255,255,.15)}
tr.total-row td.label{background:linear-gradient(90deg,#164E63,#164E63);color:#fff !important;font-family:'Inter',system-ui,sans-serif}
tr.section-row td{background:#ECFEFF;font-weight:700;color:#0E7490;border-top:2px solid #A5F3FC;cursor:pointer}
tr.section-row:hover td{background:#CFFAFE}
tr.sub-row td{background:#FAFAFA}
tr.sub-row:hover td{background:#ECFEFF}
tr.city-row td{background:#ECFEFF}
tr.city-row:hover td{background:#CFFAFE}
tr.dealer-row td{background:#FAFAFA;border-top:none}
tr.dealer-row:hover td{background:#FEF3C7}

/* ── Badges ── */
.badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:10px;font-weight:700;font-family:'DM Mono',monospace;white-space:nowrap}
.badge-green{background:#CFFAFE;color:#155E75}
.badge-amber{background:#FEF3C7;color:#92400E}
.badge-red{background:#FEE2E2;color:#B91C1C}
.badge-blue{background:#DBEAFE;color:#1D4ED8}
.badge-gray{color:#94A3B8;font-family:'DM Mono',monospace;font-size:10px}
.scroll-x{overflow-x:auto}

/* ── Filter bar ── */
.filter-bar{display:flex;align-items:center;gap:10px;padding:10px 16px;background:#fff;border:1px solid #E2E8F0;border-radius:12px;margin-bottom:14px;flex-wrap:wrap;box-shadow:var(--shadow-card)}
.filter-bar label{font-size:9px;font-weight:700;color:#475569;text-transform:uppercase;letter-spacing:.08em;white-space:nowrap}
.ms-btn{display:inline-flex;align-items:center;gap:5px;border:1px solid #CBD5E1;border-radius:20px;padding:4px 12px;font-size:11px;font-family:inherit;background:#fff;cursor:pointer;color:#0f172a;box-shadow:0 1px 2px rgba(0,0,0,.04);white-space:nowrap;transition:all var(--dur-fast)}
.ms-btn:hover,.ms-btn.open{border-color:var(--red);background:var(--red-50);color:var(--red-d)}
.ms-btn .ms-count{background:var(--red);color:#fff;border-radius:9px;padding:1px 6px;font-size:9px;font-weight:700}
.ms-dropdown{position:absolute;top:calc(100% + 4px);left:0;min-width:200px;max-width:280px;background:#fff;border:1px solid #E2E8F0;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.12);z-index:500;overflow:hidden}
.ms-dropdown-header{padding:8px 12px 6px;border-bottom:1px solid #F1F5F9;display:flex;align-items:center;justify-content:space-between}
.ms-dropdown-list{max-height:220px;overflow-y:auto;padding:4px 0}
.ms-option{display:flex;align-items:center;gap:8px;padding:6px 12px;cursor:pointer;font-size:11px;transition:background var(--dur-fast)}
.ms-option:hover{background:var(--red-50)}
.ms-option input[type=checkbox]{accent-color:var(--red);width:13px;height:13px;cursor:pointer}
.ms-option.all-opt{font-weight:700;border-bottom:1px solid #F1F5F9;margin-bottom:2px}

/* ── Buttons ── */
.btn{padding:8px 20px;border-radius:8px;border:none;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;transition:all var(--dur-fast)}
.btn-primary{background:var(--red);color:#fff}
.btn-primary:hover{background:var(--red-d)}
.btn-secondary{background:#F1F5F9;color:#475569;border:1px solid #E2E8F0}
.btn-secondary:hover{background:#E2E8F0}
.btn-ghost{background:none;border:1px solid #E2E8F0;color:#475569;padding:5px 14px;border-radius:20px;font-size:11px;font-weight:600;cursor:pointer;font-family:inherit;transition:all var(--dur-fast)}
.btn-ghost:hover{background:var(--red-50);border-color:var(--red);color:var(--red-d)}

/* ── Misc ── */
.section-title{font-size:11px;font-weight:700;color:#334155;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.section-title::after{content:'';flex:1;height:1px;background:#E2E8F0}
.err-box{background:#FEF2F2;border:1px solid #FECACA;border-radius:8px;padding:10px 14px;font-size:11px;color:#B91C1C;margin-top:8px}
.spinner{width:20px;height:20px;border:2px solid #FFD6DB;border-top-color:var(--red);border-radius:50%;animation:spin .7s linear infinite;display:inline-block}
.cell-hot{background:#A5F3FC!important}
.cell-warm{background:#FEF08A!important}
.cell-cold{background:#FECDD3!important}
.cell-nil{background:#F1F5F9!important;color:#94A3B8!important}
.prog-track{flex:1;height:6px;background:#F1F5F9;border-radius:3px;overflow:hidden;min-width:50px}
.prog-fill{height:100%;background:var(--red);border-radius:3px}

/* ── Auth screens ── */
.auth-overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#164E63 0%,#0891B2 100%);z-index:1000}
.auth-card{background:#fff;border-radius:20px;padding:40px 44px;max-width:440px;width:90%;box-shadow:0 24px 60px rgba(0,0,0,.25)}
.auth-logo{display:flex;align-items:center;gap:12px;margin-bottom:28px}
.auth-logo-icon{width:48px;height:48px;border-radius:14px;background:linear-gradient(135deg,#164E63,#0891B2);display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:900;color:#fff;font-family:'DM Mono',monospace;letter-spacing:-.04em;flex-shrink:0}
.auth-title{font-size:22px;font-weight:800;color:#0f172a;margin-bottom:4px;letter-spacing:-.03em}
.auth-subtitle{font-size:12px;color:#64748B;margin-bottom:24px;line-height:1.5}
.auth-label{display:block;font-size:11px;font-weight:600;color:#475569;text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
.auth-input{width:100%;padding:10px 14px;border:1.5px solid #E2E8F0;border-radius:10px;font-size:13px;font-family:inherit;color:#0f172a;outline:none;transition:border-color 160ms}
.auth-input:focus{border-color:var(--red)}
.auth-input-wrap{margin-bottom:14px}
.auth-btn{width:100%;padding:12px;background:var(--red);color:#fff;border:none;border-radius:10px;font-size:13px;font-weight:700;font-family:inherit;cursor:pointer;transition:background 160ms;margin-top:4px}
.auth-btn:hover{background:var(--red-d)}
.auth-btn:disabled{background:#CBD5E1;cursor:not-allowed}
.auth-note{font-size:10px;color:#94A3B8;text-align:center;margin-top:16px;line-height:1.5}
.auth-err{background:#FEE2E2;border:1px solid #FECACA;border-radius:8px;padding:8px 12px;font-size:11px;color:#B91C1C;margin-bottom:12px}
.auth-ok{background:#CFFAFE;border:1px solid #A5F3FC;border-radius:8px;padding:8px 12px;font-size:11px;color:#155E75;margin-bottom:12px}
.auth-back{background:none;border:none;color:#94A3B8;font-size:11px;cursor:pointer;font-family:inherit;margin-top:12px;text-decoration:underline;display:block;text-align:center}
.auth-back:hover{color:#475569}
/* ── Admin modal ── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:900}
.modal-box{background:#fff;border-radius:16px;padding:28px 32px;max-width:660px;width:94%;max-height:82vh;overflow-y:auto;box-shadow:0 24px 60px rgba(0,0,0,.25)}
.modal-title{font-size:16px;font-weight:800;color:#0f172a;margin-bottom:4px}
.modal-sub{font-size:11px;color:#64748B;margin-bottom:18px}
.req-card{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border:1px solid #E2E8F0;border-radius:10px;margin-bottom:8px;gap:12px;flex-wrap:wrap}
.req-card-info{flex:1;min-width:0}
.req-card-name{font-size:13px;font-weight:700;color:#0f172a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.req-card-email{font-size:11px;color:#64748B;font-family:'DM Mono',monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.req-card-time{font-size:10px;color:#94A3B8;margin-top:2px}
.req-card-actions{display:flex;gap:8px;align-items:center;flex-shrink:0}
.role-sel{border:1px solid #E2E8F0;border-radius:8px;padding:5px 8px;font-size:11px;font-family:inherit;cursor:pointer;background:#fff}
.btn-approve{background:#CFFAFE;color:#155E75;border:1px solid #A5F3FC;border-radius:8px;padding:5px 14px;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap}
.btn-approve:hover{background:#A5F3FC}
.btn-reject{background:#FEE2E2;color:#B91C1C;border:1px solid #FECACA;border-radius:8px;padding:5px 14px;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap}
.btn-reject:hover{background:#FECACA}
.no-pending{text-align:center;padding:32px;color:#94A3B8;font-size:13px}
/* ── User avatar chip ── */
.user-chip{display:flex;align-items:center;gap:8px;padding:4px 10px 4px 6px;background:#F1F5F9;border:1px solid #E2E8F0;border-radius:20px;cursor:default}
.user-avatar{width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,#164E63,#0891B2);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#fff;flex-shrink:0}
.user-name{font-size:11px;font-weight:600;color:#0f172a;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.user-role-badge{font-size:9px;font-weight:700;padding:1px 7px;border-radius:10px;text-transform:uppercase;letter-spacing:.05em}
.role-full{background:#DBEAFE;color:#1D4ED8}
.role-viewer{background:#FEF3C7;color:#92400E}
.role-admin{background:#EDE9FE;color:#6D28D9}

/* ── Ather Firebase Auth / Presence ── */
.auth-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#ECFEFF 0%,#FFFBF5 100%);padding:24px}
.auth-screen .auth-card{background:#fff;border-radius:20px;padding:44px 40px;max-width:400px;width:100%;text-align:center;box-shadow:0 8px 40px rgba(8,145,178,.15);border:1px solid #CFFAFE}
.auth-screen .auth-btn{display:inline-flex;align-items:center;gap:10px;padding:12px 28px;border-radius:12px;border:1px solid #E2E8F0;background:#fff;font-size:14px;font-weight:600;cursor:pointer;color:#374151;font-family:inherit;box-shadow:0 2px 6px rgba(0,0,0,.08);transition:all .15s}
.auth-screen .auth-btn:hover{box-shadow:0 4px 14px rgba(0,0,0,.14);transform:translateY(-1px)}
.auth-error{margin-top:14px;padding:9px 14px;background:#FFF1F2;border:1px solid #FECDD3;border-radius:10px;font-size:12px;color:#BE123C;font-weight:500}
.presence-strip{display:flex;align-items:center;gap:6px;padding:4px 0}
.avatar{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff;cursor:default;position:relative;flex-shrink:0;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.avatar:hover .avatar-tip{display:block}
.avatar-tip{display:none;position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);background:#1E293B;color:#fff;font-size:10px;padding:4px 9px;border-radius:7px;white-space:nowrap;z-index:200;pointer-events:none}
.admin-panel-overlay{position:fixed;inset:0;background:rgba(15,23,42,.5);backdrop-filter:blur(4px);z-index:1000;display:flex;align-items:center;justify-content:center;padding:24px}
.admin-card{background:#fff;border-radius:16px;padding:28px 32px;max-width:680px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.2);max-height:80vh;overflow-y:auto}
.viewer-badge{background:#DBEAFE;color:#1D4ED8;font-size:9px;font-weight:700;padding:2px 9px;border-radius:20px;letter-spacing:.06em;text-transform:uppercase}

/* ── Font-scale: all base font-sizes respond to --dashboard-font-scale ── */
.kpi-label{font-size:calc(9px * var(--dashboard-font-scale))}
.kpi-value{font-size:calc(24px * var(--dashboard-font-scale))}
.kpi-value.kpi-long{font-size:calc(16px * var(--dashboard-font-scale))}
.kpi-value.kpi-med{font-size:calc(20px * var(--dashboard-font-scale))}
.kpi-sub{font-size:calc(10px * var(--dashboard-font-scale))}
.tab-pill{font-size:calc(12px * var(--dashboard-font-scale))}
table{font-size:calc(11.5px * var(--dashboard-font-scale))}
th{font-size:calc(9.5px * var(--dashboard-font-scale))}
th.sub{font-size:calc(8.5px * var(--dashboard-font-scale))}
td{font-size:calc(11.5px * var(--dashboard-font-scale))}
td.label{font-size:calc(12px * var(--dashboard-font-scale))}
td.sub-label{font-size:calc(11px * var(--dashboard-font-scale))}
.badge{font-size:calc(10px * var(--dashboard-font-scale))}
.badge-gray{font-size:calc(10px * var(--dashboard-font-scale))}
.filter-bar label{font-size:calc(9px * var(--dashboard-font-scale))}
.ms-btn{font-size:calc(11px * var(--dashboard-font-scale))}
.ms-btn .ms-count{font-size:calc(9px * var(--dashboard-font-scale))}
.ms-option{font-size:calc(11px * var(--dashboard-font-scale))}
.btn{font-size:calc(12px * var(--dashboard-font-scale))}
.btn-ghost{font-size:calc(11px * var(--dashboard-font-scale))}
.section-title{font-size:calc(11px * var(--dashboard-font-scale))}
.err-box{font-size:calc(11px * var(--dashboard-font-scale))}
/* Header text helpers */
.hdr-title{font-size:calc(13px * var(--dashboard-font-scale));font-weight:800;color:#fff;letter-spacing:-.02em}
.hdr-sub{font-size:calc(9px * var(--dashboard-font-scale));color:#A5F3FC;letter-spacing:.07em;font-weight:600}
.hdr-kpi-lbl{font-size:calc(8px * var(--dashboard-font-scale));font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#A5F3FC}
.hdr-kpi-val{font-size:calc(13px * var(--dashboard-font-scale));font-weight:800;color:#fff;font-family:'DM Mono',monospace;letter-spacing:-.02em}
/* SummaryBar helpers */
.sum-label{font-size:calc(9px * var(--dashboard-font-scale));font-weight:800;color:#003087;text-transform:uppercase;letter-spacing:.1em;padding-right:12px;margin-right:4px;border-right:1px solid #BFDBFE;white-space:nowrap;min-width:52px;align-self:center}
.sum-kpi-lbl{font-size:calc(9px * var(--dashboard-font-scale));color:#64748B;font-weight:600;text-transform:uppercase;letter-spacing:.06em;margin-bottom:2px;white-space:nowrap}
.sum-kpi-val{font-size:calc(14px * var(--dashboard-font-scale));font-weight:700;font-family:'DM Mono',monospace;white-space:nowrap}
/* Diagnostics bar */
.diag-bar{background:#F0F9FF;border-bottom:1px solid #BAE6FD;padding:5px 24px;font-size:calc(10px * var(--dashboard-font-scale));font-family:'DM Mono',monospace;color:#0C4A6E}
/* Font-size control buttons */
.fs-ctrl{display:flex;align-items:center;gap:3px;flex-shrink:0}
.fs-btn{padding:3px 8px;font-size:11px;font-weight:700;font-family:inherit;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.12);color:#fff;border-radius:6px;cursor:pointer;transition:background var(--dur-fast);line-height:1.4}
.fs-btn:hover:not(:disabled){background:rgba(255,255,255,.25)}
.fs-btn:disabled{opacity:.35;cursor:default}
.fs-btn:focus-visible{outline:2px solid #fff;outline-offset:1px}
</style>
</head>
<body>
<div id="root"></div>
<script>
'use strict';

/* ════════════════════════════════════════════════════════════════════
   GOOGLE SHEETS SYNC CONFIG — Ather LDR Dashboard
   ════════════════════════════════════════════════════════════════════ */

/* Per-month Lead Master URLs.  Add a new entry for each rollover month.
   Keys must match normalizeAtherMonth output, e.g. "Aug'2026", "Sep'2026".
   Rows from all configured months are fetched in parallel and combined
   before parsing; lead_month on each row provides data isolation. */
const ATHER_LEAD_MASTER_BY_MONTH = {
  "May'2026": "https://docs.google.com/spreadsheets/d/1jnhdvPUEefW7HrD44ffvH2k3v0eUe2JGolXkX6EIKbQ/edit?gid=2013005874#gid=2013005874",
  "Jun'2026": "https://docs.google.com/spreadsheets/d/1qAvzs6ucsPtk3joTsYeHijk2Tx_JRcCBsXzKDbnEOPc/edit?gid=2013005874#gid=2013005874",

function sheetUrlToCsvUrl(url){
  const u=(url||'').trim();
  if(!u) throw new Error('Sheet URL is empty.');
  const idM=u.match(/\/spreadsheets\/d\/([a-zA-Z0-9_\-]+)/);
  if(!idM) throw new Error('Not a valid Google Sheets URL.');
  const id=idM[1];
  const gidM=u.match(/[#&?]gid=(\d+)/);
  const gid=gidM?gidM[1]:'0';
  return 'https://docs.google.com/spreadsheets/d/'+id+'/gviz/tq?tqx=out:csv&gid='+gid;
}

async function fetchSheetCsv(url){
  const csvUrl=sheetUrlToCsvUrl(url);
  let res;
  try{ res=await fetch(csvUrl,{cache:'no-store'}); }
  catch(e){ throw new Error('Network error ('+e.message+')'); }
  if(!res.ok){
    if(res.status===401||res.status===403) throw new Error('Access denied — share sheet as Anyone → Viewer');
    throw new Error('HTTP '+res.status);
  }
  const text=await res.text();
  if(!text||text.trim().length<5) throw new Error('Sheet returned no data.');
  if(text.trim().startsWith('<')) throw new Error('Sheet returned HTML — share as Anyone → Viewer.');
  return text;
}

function parseCsvToRows(csvText){
  let text=csvText;
  if(text.charCodeAt(0)===0xFEFF) text=text.slice(1);
  const rows=[];
  let row=[],field='',inQuotes=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(inQuotes){
      if(c==='"'){if(text[i+1]==='"'){field+='"';i++;}else inQuotes=false;}
      else field+=c;
    } else if(c==='"'){ inQuotes=true; }
    else if(c===','){ row.push(field); field=''; }
    else if(c==='\r'){}
    else if(c==='\n'){ row.push(field); field=''; rows.push(row); row=[]; }
    else field+=c;
  }
  if(field.length||row.length){ row.push(field); rows.push(row); }
  if(!rows.length) return[];
  const headers=rows[0];
  const out=[];
  for(let r=1;r<rows.length;r++){
    const rv=rows[r];
    if(rv.length===1&&rv[0]==='') continue;
    const obj={};
    for(let c=0;c<headers.length;c++) obj[headers[c]]=rv[c]!==undefined?rv[c]:'';
    out.push(obj);
  }
  return out;
}

  if (['whatsapp'].some(p => n.includes(p))) return 'whatsapp';

const MONTH_NAMES=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

const STATE_GARBAGE=new Set(['#N/A','\\0','\0','N/A','NA']);
const STATE_FIX={'Jammu & Kashmir':'Jammu and Kashmir','Orissa':'Odisha'};
function canonicalState(s){const t=(s||'').trim();if(!t||STATE_GARBAGE.has(t))return'';return STATE_FIX[t]||t;}

function atherMonthOrder(m){
  if(!m||m==='-'||m==='')return 0;
  const match=m.match(/([A-Za-z]+)'(\d+)/);
  if(!match)return 0;
  const mi=MONTH_NAMES.indexOf(match[1]);
  return parseInt(match[2])*12+mi;
}

function normalizeAtherMonth(s){
  if(!s||s==='-')return'';
  s=String(s).trim();
  if(/^[A-Za-z]{3}'\d{4}$/.test(s))return s[0].toUpperCase()+s[1].toLowerCase()+s[2].toLowerCase()+"'"+s.slice(4);
  const m1=s.match(/^([A-Za-z]{3,})\s+(\d{4})$/);
  if(m1){const mi=MONTH_NAMES.findIndex(n=>n.toLowerCase()===m1[1].toLowerCase().slice(0,3));if(mi>=0)return MONTH_NAMES[mi]+"'"+m1[2];}
  const m2=s.match(/^(\d{4})-(\d{2})(?:-\d{2})?/);
  if(m2)return MONTH_NAMES[parseInt(m2[2])-1]+"'"+m2[1];
  const m3=s.match(/^(\d{1,2})[\/\-](\d{4})$/);
  if(m3)return MONTH_NAMES[parseInt(m3[1])-1]+"'"+m3[2];
  const m4=s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);
  if(m4)return MONTH_NAMES[parseInt(m4[2])-1]+"'"+m4[3];
  // Mon-YY format (e.g. "Aug-26" → "Aug'2026")
  const m5=s.match(/^([A-Za-z]{3})-(\d{2})$/);
  if(m5){const mi=MONTH_NAMES.findIndex(n=>n.toLowerCase()===m5[1].toLowerCase());if(mi>=0)return MONTH_NAMES[mi]+"'"+(2000+parseInt(m5[2]));}
  return s;
}

function parseAtherDate(s){
  if(!s)return null;
  s=String(s).trim();
  if(!s)return null;
  // YYYY-MM-DD HH:mm:ss or YYYY-MM-DD HH:mm (datetime with space or T separator, e.g. "2026-08-20 12:35:09")
  const mdt=s.match(/^(\d{4})[\/\-](\d{2})[\/\-](\d{2})[\sT]\d{2}:\d{2}/);
  if(mdt)return new Date(+mdt[1],+mdt[2]-1,+mdt[3]);
  // YYYY-MM-DD or YYYY/MM/DD
  const m1=s.match(/^(\d{4})[\/\-](\d{2})[\/\-](\d{2})$/);
  if(m1)return new Date(+m1[1],+m1[2]-1,+m1[3]);
  // DD/MM/YYYY or DD-MM-YYYY (numeric parts only)
  const m2=s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);
  if(m2)return new Date(+m2[3],+m2[2]-1,+m2[1]);
  // DD-Mon-YYYY or DD/Mon/YYYY or DD Mon YYYY (e.g. 03-Aug-2026, 03/Aug/2026)
  const MONS=['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];
  const m3=s.match(/^(\d{1,2})[\-\/\s]([A-Za-z]{3,9})[\-\/\s](\d{4})$/);
  if(m3){const mi=MONS.findIndex(n=>m3[2].toLowerCase().startsWith(n));if(mi>=0)return new Date(+m3[3],mi,+m3[1]);}
  // Mon-DD-YYYY or Mon/DD/YYYY (e.g. Aug-03-2026)
  const m4=s.match(/^([A-Za-z]{3,9})[\-\/\s](\d{1,2})[\-\/\s](\d{4})$/);
  if(m4){const mi=MONS.findIndex(n=>m4[1].toLowerCase().startsWith(n));if(mi>=0)return new Date(+m4[3],mi,+m4[2]);}
  // Excel serial date (numeric only, valid range 30000–60000 ≈ 1982–2064)
  if(/^\d+(\.\d+)?$/.test(s)){
    const serial=parseFloat(s);
    if(serial>30000&&serial<60000){
      const d=new Date(Date.UTC(1899,11,30));
      d.setUTCDate(d.getUTCDate()+Math.floor(serial));
      return new Date(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate());
    }
  }
  return null;
}

    for(const [k,rk] of Object.entries(keyMap)){
      if(k.includes('attribution')||(k.includes('retail')&&k.includes('date'))||k==='date'){
        // Try first 5 rows for a parseable date
        for(let ri=0;ri<Math.min(raw.length,5);ri++){
          if(parseAtherDate(String(raw[ri][rk]||'').trim())){retailDateColKey=rk;break;}
        }
        if(retailDateColKey)break;
      }
    }
  }
  // Detect brand/process column
  const BRAND_ALIASES=['process','brand','oem','manufacturer','oem brand','brand name'];
  let brandColKey=null;
  for(const alias of BRAND_ALIASES){if(keyMap[alias]){brandColKey=keyMap[alias];break;}}
  // Collect sample date values (ALL rows regardless of brand, from detected date col)
  const sampleRetailDateValues=[];
  if(retailDateColKey){
    for(let i=0;i<Math.min(raw.length,50)&&sampleRetailDateValues.length<10;i++){
      const v=String(raw[i][retailDateColKey]||'').trim();
      if(v){const pd=parseAtherDate(v);sampleRetailDateValues.push({raw:v,parsed:pd?formatRetailDate(pd):null});}
    }
  }
  function get(r,keys){
    for(const k of(Array.isArray(keys)?keys:[keys])){
      const kl=k.toLowerCase().replace(/\s+/g,' ').trim();
      const rk=keyMap[kl];
      if(rk!==undefined)return String(r[rk]||'').trim();
    }
    return'';
  }
  const rows=[];
  let maxRetailDate=null;
  let excludedBrand=0,excludedKey=0,excludedBeforeCutoff=0,excludedInvalidDate=0;
  let reBrandCount=0,reDateCount=0;
  let earliestRetailDate=null,latestRetailDate=null,latestDmsDate=null,latestCoDate=null;
  const brandValMap=new Map();
  const rawDateSamples=[]; // raw date strings from Hero-brand rows
  const rawKeySamples=[]; // sourceLeadId values from Hero-brand rows
  for(const r of raw){
    const proc=brandColKey?String(r[brandColKey]||'').trim():get(r,['process','brand','oem','manufacturer','oem brand','brand name']);
    const procLow=(proc||'').toLowerCase().trim();
    // Track all brand values
    brandValMap.set(proc||'(empty)',(brandValMap.get(proc||'(empty)')||0)+1);
    // Hero brand filter: accept if empty OR starts with 'hero'
    // IMPORTANT: do NOT change this to startsWith unless we confirm the actual brand value
    // Using strict match first, then log what the actual values are
    const isHeroBrand=!proc||procLow==='hero'||procLow.startsWith('hero');
    if(!isHeroBrand){excludedBrand++;continue;}
    reBrandCount++;
    const sourceLeadId=get(r,['sourcelead id','sourcelead_id','source lead id','source_lead_id','sourceleadid','lead id','leadid','optyid','opty id','opty_id']);
    const performanceMonth=normalizeAtherMonth(get(r,['performance month','performancemonth','performance_month','retail month','retailmonth','month']));
    if(!sourceLeadId||!performanceMonth){excludedKey++;continue;}
    // Capture sample keys and dates from Hero-brand rows
    if(rawKeySamples.length<10)rawKeySamples.push(sourceLeadId);
    const dateStr=retailDateColKey?String(r[retailDateColKey]||'').trim():get(r,['retail_attribution_date','retailattributiondate','attribution date','attribution_date','retail date','retaildate','retail_date','date']);
    if(rawDateSamples.length<10&&dateStr)rawDateSamples.push({raw:dateStr,parsed:parseAtherDate(dateStr)?formatRetailDate(parseAtherDate(dateStr)):null});
    // Retail_Attribution_Date is REQUIRED — null/unparseable = exclude
    const retailDate=parseAtherDate(dateStr);
    if(!retailDate||isNaN(retailDate.getTime())){excludedInvalidDate++;continue;}
    reDateCount++;
    if(retailDate<DATA_CUTOFF){excludedBeforeCutoff++;continue;}
    if(!maxRetailDate||retailDate>maxRetailDate)maxRetailDate=retailDate;
    if(!earliestRetailDate||retailDate<earliestRetailDate)earliestRetailDate=retailDate;
    if(!latestRetailDate||retailDate>latestRetailDate)latestRetailDate=retailDate;
    const ctRaw=get(r,['call type','calltype','call_type','call-type']);
    const ctLow=ctRaw.toLowerCase();
    const callType=ctLow.includes('dms')?'dms':ctLow.includes('call')?'co':'other';
    if(callType==='dms'){if(!latestDmsDate||retailDate>latestDmsDate)latestDmsDate=retailDate;}
    if(callType==='co'){if(!latestCoDate||retailDate>latestCoDate)latestCoDate=retailDate;}
    const purchasedModel=get(r,['purchasedmodel','purchased model','purchased_model','purchasedmodelname','purchased model name','model','model name','vehicle model','vehicle_model','product','product name','vehicle name','vehiclename','vehicle','model_name','productname']);
    rows.push({sourceLeadId,performanceMonth,callType,retailDate,purchasedModel});
  }
  const uniqueIds=new Set(rows.map(r=>r.sourceLeadId)).size;
  const brandValues=[...brandValMap.entries()].sort((a,b)=>b[1]-a[1]).slice(0,10).map(([v,c])=>v+'('+c+')');
  return{rows,diagnostics:{
    totalRows:raw.length,reRows:rows.length,uniqueIds,
    excludedBrand,excludedKey,excludedBeforeCutoff,excludedInvalidDate,
    reBrandCount,reDateCount,
    earliestRetailDate,latestRetailDate,latestDmsDate,latestCoDate,
    detectedDateCol:retailDateColKey||'(not found)',
    brandColKey:brandColKey||'(not found)',
    brandValues,rawDateSamples,rawKeySamples,
    sampleRetailDateValues,allRetailCols
  },maxRetailDate};
}

function joinREData(leadResult,retailResult){
  const{rows:leadRows,diagnostics:leadDiag}=leadResult;
  const{rows:retailRows,diagnostics:retailDiag}=retailResult;
  const retailMap=new Map();
  for(const rr of retailRows){
    if(!retailMap.has(rr.sourceLeadId))retailMap.set(rr.sourceLeadId,[]);
    retailMap.get(rr.sourceLeadId).push(rr);
  }
  // Key matching sample for diagnostics
  const retailKeySet=new Set(retailRows.map(r=>r.sourceLeadId));
  const leadKeySet=new Set(leadRows.map(r=>r.opty_id));
  const keyMatchSamples=[];
  for(const rk of retailKeySet){
    if(keyMatchSamples.length>=5)break;
    keyMatchSamples.push({retailKey:rk,inLeads:leadKeySet.has(rk)});
  }
  let matched=0,unmatched=0,multiRetail=0;
  const joined=leadRows.map(lr=>{
    const retail=retailMap.get(lr.opty_id)||[];
    const isBooked=retail.length>0;
    if(isBooked){matched++;if(retail.length>1)multiRetail++;}else unmatched++;
    const sorted=isBooked?retail.sort((a,b)=>atherMonthOrder(a.performanceMonth)-atherMonthOrder(b.performanceMonth)):[];
    const booking_month=isBooked?sorted[0].performanceMonth:'';
    const callType=isBooked?(sorted[0].callType||'other'):'other';
    const retailDate=isBooked?(sorted[0].retailDate||null):null;
    const purchasedModel=isBooked?(sorted[0].purchasedModel||''):'';
    return{opty_id:lr.opty_id,lt:lr.lt,source:lr.source,webId:lr.webId||'Unknown',model:lr.model,city:lr.city,state:lr.state,
      ao:lr.ao||'',region:lr.region||'',
      lead_month:lr.lead_month,booking_month,isUnique:lr.isUnique,isBooked,callType,
      leadDate:lr.leadDate||null,retailDate,purchasedModel,
      encryptMobile:lr.encryptMobile||'',idVerifiedLead:lr.idVerifiedLead||'',brand:lr.brand||'',
      verifiedDealer:lr.verifiedDealer||'',dealerId:lr.dealerId||'',oemCrmId:lr.oemCrmId||'',
      dealerName:lr.dealerName||'',enquiryId:lr.enquiryId||'',utmCampaign:lr.utmCampaign||'',statusName:lr.statusName||''};
  });
  return{rows:joined,diagnostics:{
    leadTotalRows:leadDiag.totalRows,leadIncluded:leadDiag.included,leadUniqueIds:leadDiag.uniqueIds,leadDupIds:leadDiag.dupIds,
    leadExcludedBeforeCutoff:leadDiag.excludedBeforeCutoff,leadExcludedInvalidDate:leadDiag.excludedInvalidDate,
    leadEarliestDate:leadDiag.earliestDate,leadLatestDate:leadDiag.latestDate,
    retailTotalRows:retailDiag.totalRows,retailHeroRows:retailDiag.reRows,retailUniqueIds:retailDiag.uniqueIds,
    retailExcludedBrand:retailDiag.excludedBrand,retailExcludedKey:retailDiag.excludedKey,
    retailExcludedBeforeCutoff:retailDiag.excludedBeforeCutoff,retailExcludedInvalidDate:retailDiag.excludedInvalidDate,
    retailREBrandCount:retailDiag.reBrandCount,retailREDateCount:retailDiag.reDateCount,
    retailEarliestDate:retailDiag.earliestRetailDate,retailLatestDate:retailDiag.latestRetailDate,
    retailLatestDmsDate:retailDiag.latestDmsDate,retailLatestCoDate:retailDiag.latestCoDate,
    retailBrandValues:retailDiag.brandValues,retailRawDateSamples:retailDiag.rawDateSamples,
    retailRawKeySamples:retailDiag.rawKeySamples,keyMatchSamples,
    retailKeyCount:retailKeySet.size,leadKeyCount:leadKeySet.size,
    matched,unmatched,multiRetail}};
}

function parseAtherNonScopeRetailRows(raw, joinedRows) {
  if (!raw.length || !joinedRows.length) return [];
  const leadMap = new Map();
  for (const r of joinedRows) leadMap.set(r.opty_id, r);
  const keyMap = {};
  Object.keys(raw[0]).forEach(rk => { keyMap[rk.toLowerCase().replace(/\s+/g,' ').trim()] = rk; });
  function get(r, keys) {
    for (const k of (Array.isArray(keys)?keys:[keys])) {
      const rk = keyMap[k.toLowerCase().replace(/\s+/g,' ').trim()];
      if (rk !== undefined) return String(r[rk]||'').trim();
    }
    return '';
  }
  const seen = new Set();
  const rows = [];
  for (const r of raw) {
    const sourceLeadId = get(r,['sourcelead id','sourcelead_id','source lead id','source_lead_id','sourceleadid','lead id','leadid','optyid','opty id','opty_id']);
    if (!sourceLeadId) continue;
    const lead = leadMap.get(sourceLeadId);
    if (!lead) continue;
    const invoiceMonth = normalizeAtherMonth(get(r,['invoice month','invoicemonth','invoice_month','performance month','performancemonth','retail month','retailmonth','month']));
    if (!invoiceMonth) continue;
    // Lead Categorisation from NS sheet (e.g. "Direct Push / L1 Nurtured" or similar).
    // Do NOT use web_id/webid aliases — those are different concepts.
    // Fallback: Lead Categorisation from Lead Master (stored as lead.webId — "Direct Push / L1 Nurtured").
    const leadCatFromSheet = get(r,['lead categorisation','lead categorization','lead_categorisation','lead_categorization','leadcategorisation','leadcat','lead cat','direct push/l1 nurtured','direct push/ l1 nurtured','direct push / l1 nurtured']);
    const leadCat = leadCatFromSheet || lead.webId || 'Unknown';
    const invoicedModel = get(r,['invoiced model','invoicedmodel','invoiced_model','model','vehicle model','vehicle_model','model name','modelname']);
    // Exact-row dedup: only remove rows where every significant field is identical.
    // Same SourceLeadId with different invoice/model/category = separate retail records (kept).
    const allVals = Object.values(r).map(v=>String(v==null?'':v)).join('\x00');
    const dedupKey = allVals;
    if (seen.has(dedupKey)) continue;
    seen.add(dedupKey);
    rows.push({opty_id:sourceLeadId,source:lead.source,state:lead.state,ao:lead.ao,city:lead.city,region:lead.region,lead_month:lead.lead_month,lt:lead.lt,model:lead.model,invoiceMonth,leadCat,invoicedModel});
  }
  return rows;
}

function HeroDiagnostics({d}){
  if(!d)return null;
  const fmtD=v=>v instanceof Date&&!isNaN(v)?formatRetailDate(v):'—';
  const items=[
    {l:'Latest Lead',v:fmtD(d.leadLatestDate)},
    {l:'Latest Retail',v:fmtD(d.retailLatestDate)},
    {l:'Latest DMS Retail',v:fmtD(d.retailLatestDmsDate)},
    {l:'Latest Call Out Retail',v:fmtD(d.retailLatestCoDate)},
  ];
  return ce('div',{className:'diag-bar'},
    ce('span',{style:{fontWeight:700,marginRight:12}},'Data Status:'),
    items.map((it,i)=>ce('span',{key:i,style:{marginRight:20}},it.l+': ',ce('strong',null,it.v)))
  );
}

/* buildPayload: Ather flat rows → compact matrix format
   On Create matrices (no prefix) = all leads bucketed by lead_month
   On Update matrices (bm_ prefix) = all leads bucketed by booking_month
     (booked leads → booking_month; unbooked → lead_month)
*/
function buildPayload(joinedRows){
  const now=Date.now();
  const lmArr=[],lmMap=Object.create(null);
  const srcArr=[],srcMap=Object.create(null);
  const mdlArr=[],mdlMap=Object.create(null);
  const stArr=[],stMap=Object.create(null);
  const ltArr=[],ltMap=Object.create(null);
  const cityArr=[],cityMap=Object.create(null);
  const wiArr=[],wiMap=Object.create(null);
  function idx(arr,map,val){if(val in map)return map[val];const i=arr.length;arr.push(val);map[val]=i;return i;}
  for(const r of joinedRows){
    idx(lmArr,lmMap,r.lead_month||'Unknown');
    if(r.booking_month)idx(lmArr,lmMap,r.booking_month); // ensure booking months are in lm map
    idx(srcArr,srcMap,r.source||'Unknown');
    idx(mdlArr,mdlMap,r.model||'Unknown');
    idx(stArr,stMap,r.state||'Unknown');
    idx(ltArr,ltMap,r.lt||'Unknown');
    idx(cityArr,cityMap,r.city||'Unknown');
    idx(wiArr,wiMap,r.webId||'Unknown');
  }
  const city_state=new Array(cityArr.length).fill(0);
  for(const r of joinedRows) city_state[cityMap[r.city||'Unknown']]=stMap[r.state||'Unknown'];

  function isRetailed(r){
    if(!r.isBooked||!r.booking_month||!r.lead_month)return false;
    const d=atherMonthOrder(r.booking_month)-atherMonthOrder(r.lead_month);
    return d>=0&&d<=2;
  }

  // On Create accumulators (lead_month dimension, all leads + unique subset)
  const monthlyA=new Map(),smA=new Map(),mmA=new Map(),stmA=new Map(),ltmA=new Map();
  const mxstA=new Map(),cmA=new Map(),csmA=new Map(),cxmA=new Map(),univA=new Map();
  const u_mA=new Map(),u_smA=new Map(),u_mmA=new Map(),u_stmA=new Map(),u_ltmA=new Map();
  const u_mxstA=new Map(),u_cmA=new Map(),u_csmA=new Map(),u_cxmA=new Map(),u_univA=new Map();

  // On Update accumulators (booking_month for booked; lead_month for unbooked)
  const bm_mA=new Map(),bm_smA=new Map(),bm_mmA=new Map(),bm_stmA=new Map(),bm_ltmA=new Map();
  const bm_mxstA=new Map(),bm_cmA=new Map(),bm_csmA=new Map(),bm_cxmA=new Map(),bm_univA=new Map();

  // Web ID dimension (Direct Push / L1 Nurtured)
  const wmA=new Map(),cwmA=new Map(),wunivA=new Map();
  const bm_wmA=new Map(),bm_cwmA=new Map(),bm_wunivA=new Map();

  // Retail Dispersion (bdm): [rep_days, src_idx, lm_idx, L, R_all, R_dms, R_co]
  // rep_days = representative numeric value per BD bucket (passes through bdBucket correctly)
  const BD_REP={'0–7':0,'8–14':8,'15–30':15,'31–60':31,'61–90':61,'90+':91};
  const bdmA=new Map(),u_bdmA=new Map();
  // Retail Dispersion Model matrix: [enq_mi, is_same(1=same/0=cross), lm_idx, count_all, count_dms, count_co, _]
  const rdmA=new Map();
  // Retail Dispersion Model drill-down matrix: [enq_mi, pur_mi, is_same, si, sti, ci, lti, li, cnt_all, cnt_dms, cnt_co, _]
  const purMdlArr=[],purMdlMap=Object.create(null);
  const rdmxA=new Map();
  // Purchased-model × source × month (retail only): used by Model Performance for retail attribution
  const pmsmA=new Map(),bm_pmsmA=new Map();
  const pm_ltmA=new Map(),bm_pm_ltmA=new Map(); // purMdl×LT×src×month (retail only)
  const pm_csmA=new Map(),bm_pm_csmA=new Map(); // purMdl×city×src×month (retail only)
  const pm_mxstA=new Map(),bm_pm_mxstA=new Map(); // purMdl×state×month (retail only)

  // normMdl: normalise model name for SAME vs CROSS comparison
  function normMdl(s){return(s||'').toLowerCase().replace(/^ather\s+/,'').replace(/[^a-z0-9]+/g,' ').trim();}
  // Purchased-model equivalences: these retailed models count as SAME as the mapped canonical norm
  const RE_SAME_MDL_EQUIV = {
    'splendor plus xtec': 'super splendor xtec',
    'xpulse 200 4v':      'xpulse 210',
  };
  function normForSame(n){ return RE_SAME_MDL_EQUIV[n] || n; }
  // canonPurMdl is defined at module scope — usable here and in tab components

  // a4: accumulate [L, R_all, R_dms, R_co]
  function a4(m,k,L,Ra,Rd,Rc){const e=m.get(k);if(e){e[0]+=L;e[1]+=Ra;e[2]+=Rd;e[3]+=Rc;}else m.set(k,[L,Ra,Rd,Rc]);}

  for(const r of joinedRows){
    const li=lmMap[r.lead_month||'Unknown'];
    const si=srcMap[r.source||'Unknown'];
    const mi=mdlMap[r.model||'Unknown'];
    const sti=stMap[r.state||'Unknown'];
    const lti=ltMap[r.lt||'Unknown'];
    const ci=cityMap[r.city||'Unknown'];
    const wi=wiMap[r.webId||'Unknown'];
    const L=1,R=isRetailed(r)?1:0;
    const Rd=(R&&r.callType==='dms')?1:0;
    const Rc=(R&&r.callType==='co')?1:0;

    // On Create (lead_month dimension)
    a4(monthlyA,li+'',L,R,Rd,Rc);
    a4(smA,si+'|'+li,L,R,Rd,Rc);
    a4(mmA,mi+'|'+si+'|'+li,L,R,Rd,Rc);
    a4(stmA,sti+'|'+si+'|'+li,L,R,Rd,Rc);
    a4(ltmA,lti+'|'+si+'|'+li,L,R,Rd,Rc);
    a4(mxstA,mi+'|'+sti+'|'+li,L,R,Rd,Rc);
    a4(cmA,ci+'|'+li,L,R,Rd,Rc);
    a4(csmA,ci+'|'+si+'|'+li,L,R,Rd,Rc);
    a4(cxmA,ci+'|'+mi+'|'+li,L,R,Rd,Rc);
    a4(univA,mi+'|'+si+'|'+sti+'|'+lti+'|'+li,L,R,Rd,Rc);
    if(r.isUnique){
      a4(u_mA,li+'',L,R,Rd,Rc);
      a4(u_smA,si+'|'+li,L,R,Rd,Rc);
      a4(u_mmA,mi+'|'+si+'|'+li,L,R,Rd,Rc);
      a4(u_stmA,sti+'|'+si+'|'+li,L,R,Rd,Rc);
      a4(u_ltmA,lti+'|'+si+'|'+li,L,R,Rd,Rc);
      a4(u_mxstA,mi+'|'+sti+'|'+li,L,R,Rd,Rc);
      a4(u_cmA,ci+'|'+li,L,R,Rd,Rc);
      a4(u_csmA,ci+'|'+si+'|'+li,L,R,Rd,Rc);
      a4(u_cxmA,ci+'|'+mi+'|'+li,L,R,Rd,Rc);
      a4(u_univA,mi+'|'+si+'|'+sti+'|'+lti+'|'+li,L,R,Rd,Rc);
    }

    // On Update (booking_month for booked leads, lead_month for unbooked)
    const bmi=(r.isBooked&&r.booking_month)?lmMap[r.booking_month]:li;
    a4(bm_mA,bmi+'',L,R,Rd,Rc);
    a4(bm_smA,si+'|'+bmi,L,R,Rd,Rc);
    a4(bm_mmA,mi+'|'+si+'|'+bmi,L,R,Rd,Rc);
    a4(bm_stmA,sti+'|'+si+'|'+bmi,L,R,Rd,Rc);
    a4(bm_ltmA,lti+'|'+si+'|'+bmi,L,R,Rd,Rc);
    a4(bm_mxstA,mi+'|'+sti+'|'+bmi,L,R,Rd,Rc);
    a4(bm_cmA,ci+'|'+bmi,L,R,Rd,Rc);
    a4(bm_csmA,ci+'|'+si+'|'+bmi,L,R,Rd,Rc);
    a4(bm_cxmA,ci+'|'+mi+'|'+bmi,L,R,Rd,Rc);
    a4(bm_univA,mi+'|'+si+'|'+sti+'|'+lti+'|'+bmi,L,R,Rd,Rc);

    // Web ID (Direct Push / L1 Nurtured) dimension
    a4(wmA,wi+'|'+li,L,R,Rd,Rc);
    a4(cwmA,ci+'|'+wi+'|'+li,L,R,Rd,Rc);
    a4(wunivA,mi+'|'+wi+'|'+sti+'|'+lti+'|'+li,L,R,Rd,Rc);
    a4(bm_wmA,wi+'|'+bmi,L,R,Rd,Rc);
    a4(bm_cwmA,ci+'|'+wi+'|'+bmi,L,R,Rd,Rc);
    a4(bm_wunivA,mi+'|'+wi+'|'+sti+'|'+lti+'|'+bmi,L,R,Rd,Rc);

    // Retail Dispersion (day-bucket legacy — kept for data integrity)
    if(r.isBooked&&r.leadDate&&r.retailDate){
      const days=Math.max(0,Math.round((r.retailDate.getTime()-r.leadDate.getTime())/86400000));
      const bk=bdBucket(days);
      const rep=BD_REP[bk];
      const Ra2=1,Rd2=(r.callType==='dms')?1:0,Rc2=(r.callType==='co')?1:0;
      a4(bdmA,rep+'|'+si+'|'+li,1,Ra2,Rd2,Rc2);
      if(r.isUnique)a4(u_bdmA,rep+'|'+si+'|'+li,1,Ra2,Rd2,Rc2);
    }
    // Retail Dispersion Model: SAME vs CROSS per enquired model (all filter dims)
    if(isRetailed(r)){
      const Ra2=1,Rd2=(r.callType==='dms')?1:0,Rc2=(r.callType==='co')?1:0;
      const purMI=idx(purMdlArr,purMdlMap,canonPurMdl(r.purchasedModel||''));
      // Purchased-model × source × month (retail only — L=0)
      a4(pmsmA,purMI+'|'+si+'|'+li,0,Ra2,Rd2,Rc2);
      a4(bm_pmsmA,purMI+'|'+si+'|'+bmi,0,Ra2,Rd2,Rc2);
      // Purchased-model × LT × source × month (retail only — L=0)
      a4(pm_ltmA,purMI+'|'+lti+'|'+si+'|'+li,0,Ra2,Rd2,Rc2);
      a4(bm_pm_ltmA,purMI+'|'+lti+'|'+si+'|'+bmi,0,Ra2,Rd2,Rc2);
      // Purchased-model × city × source × month (retail only — L=0)
      a4(pm_csmA,purMI+'|'+ci+'|'+si+'|'+li,0,Ra2,Rd2,Rc2);
      a4(bm_pm_csmA,purMI+'|'+ci+'|'+si+'|'+bmi,0,Ra2,Rd2,Rc2);
      // Purchased-model × state × month (retail only — L=0): for retail heatmap
      a4(pm_mxstA,purMI+'|'+sti+'|'+li,0,Ra2,Rd2,Rc2);
      a4(bm_pm_mxstA,purMI+'|'+sti+'|'+bmi,0,Ra2,Rd2,Rc2);
      const enqN=normMdl(r.model);
      const purN=normMdl(r.purchasedModel);
      if(purN){
        const isSame=(normForSame(enqN)===normForSame(purN))?1:0;
        a4(rdmA,mi+'|'+isSame+'|'+si+'|'+sti+'|'+ci+'|'+lti+'|'+li,Ra2,Rd2,Rc2,0);

/* ════════════════════════════════════════════════════════════════════
   AGGREGATION HELPERS
   ════════════════════════════════════════════════════════════════════ */
const EMPTY = Object.freeze({ l: 0, r: 0, l2r: 0 });

function fin(l, r) { return { l, r, l2r: l > 0 ? r / l * 100 : 0 }; }

/* Aggregate a compact-JSON table for ONE specific month, with optional source filter.
   Returns { grand, grandSrc, dimAggs }
   dimKeyFn(row,maps) → string dim key (or null for src-only tables)
   srcKeyFn(row,maps) → string source name
   monthKeyFn(row,maps) → string month
   extraFilter(row,maps) → bool (optional extra filter e.g. model/state filter)
*/
// makeLR: returns a [l,r] accessor for aggregation rows.
// Old format: [..., L, R]          → getLR(row) = [row[-2], row[-1]]
// New format: [..., L, R_all, R_dms, R_co] (rt_cols=1)
function makeLR(rtCols, RT) {
  if (!rtCols) return row => [row[row.length-2], row[row.length-1]];
  const ri = RT === 'dms' ? 2 : RT === 'co' ? 1 : 3; // distance from end for R
  return row => [row[row.length-4], row[row.length-ri]];
}

function aggMonth(table, maps, month, srcFilter, dimKeyFn, srcKeyFn, monthKeyFn, extraFilter, getLR) {
  const _lr = getLR || (row => [row[row.length-2], row[row.length-1]]);
  const allSrcs = !srcFilter || srcFilter.size === 0;
  const byDim = new Map();
  const bySrc = new Map();
  const byDimSrc = new Map();
  let gL = 0, gR = 0;

  for (const row of table) {
    if (monthKeyFn(row, maps) !== month) continue;
    const src = srcKeyFn ? srcKeyFn(row, maps) : null;
    if (!allSrcs && src && !srcFilter.has(src)) continue;
    if (extraFilter && !extraFilter(row, maps)) continue;
    const [l, r] = _lr(row);
    gL += l; gR += r;

    if (src) { const c = bySrc.get(src)||[0,0]; c[0]+=l; c[1]+=r; bySrc.set(src,c); }
    const dim = dimKeyFn ? dimKeyFn(row, maps) : null;
    if (dim) {
      const c = byDim.get(dim)||[0,0]; c[0]+=l; c[1]+=r; byDim.set(dim,c);
      if (src) {
        const k = dim+'\x00'+src;
        const c2 = byDimSrc.get(k)||[0,0]; c2[0]+=l; c2[1]+=r; byDimSrc.set(k,c2);
      }
    }
  }

  const grandSrc = {};
  for (const [s,v] of bySrc) grandSrc[s] = fin(v[0],v[1]);
  const dimAggs = {};
  for (const [d,dv] of byDim) {
    const srcAgg = {};
    for (const s of bySrc.keys()) {
      const v = byDimSrc.get(d+'\x00'+s);
      srcAgg[s] = v ? fin(v[0],v[1]) : EMPTY;
    }
    dimAggs[d] = { total: fin(dv[0],dv[1]), src: srcAgg };
  }
  return { grand: fin(gL,gR), grandSrc, dimAggs };
}

/* Aggregate across ALL (or selected) months — used for Overview KPIs */
function aggAll(table, maps, monthFilter, srcFilter, dimKeyFn, srcKeyFn, monthKeyFn, extraFilter, getLR) {
  const _lr = getLR || (row => [row[row.length-2], row[row.length-1]]);
  const allMonths = !monthFilter || monthFilter.size === 0;
  const allSrcs   = !srcFilter   || srcFilter.size === 0;
  const byDim = new Map();
  const bySrc = new Map();
  const byDimSrc = new Map();
  let gL = 0, gR = 0;

  for (const row of table) {
    const m = monthKeyFn(row, maps);
    if (!allMonths && !monthFilter.has(m)) continue;
    const src = srcKeyFn ? srcKeyFn(row, maps) : null;
    if (!allSrcs && src && !srcFilter.has(src)) continue;
    if (extraFilter && !extraFilter(row, maps)) continue;
    const [l, r] = _lr(row);
    gL += l; gR += r;

    if (src) { const c = bySrc.get(src)||[0,0]; c[0]+=l; c[1]+=r; bySrc.set(src,c); }
    const dim = dimKeyFn ? dimKeyFn(row, maps) : null;
    if (dim) {
      const c = byDim.get(dim)||[0,0]; c[0]+=l; c[1]+=r; byDim.set(dim,c);
      if (src) {
        const k = dim+'\x00'+src;
        const c2 = byDimSrc.get(k)||[0,0]; c2[0]+=l; c2[1]+=r; byDimSrc.set(k,c2);
      }
    }
  }

  const grandSrc = {};
  for (const [s,v] of bySrc) grandSrc[s] = fin(v[0],v[1]);
  const dimAggs = {};
  for (const [d,dv] of byDim) {
    const srcAgg = {};
    for (const s of bySrc.keys()) {
      const v = byDimSrc.get(d+'\x00'+s);
      srcAgg[s] = v ? fin(v[0],v[1]) : EMPTY;
    }
    dimAggs[d] = { total: fin(dv[0],dv[1]), src: srcAgg };
  }
  return { grand: fin(gL,gR), grandSrc, dimAggs };
}

/* Merge two aggregation results: leads from leadsAgg (L only), retail from retailAgg (R only).
   Used by Model Performance to split lead attribution (Lead Model) from retail attribution (Purchased Model). */
function mergeLeadRetailAggs(leadsAgg, retailAgg) {
  const allDims = new Set([...Object.keys(leadsAgg.dimAggs), ...Object.keys(retailAgg.dimAggs)]);
  const allSrcKeys = new Set([...Object.keys(leadsAgg.grandSrc), ...Object.keys(retailAgg.grandSrc)]);
  const dimAggs = {};
  for (const dim of allDims) {
    const ld = leadsAgg.dimAggs[dim];
    const rd = retailAgg.dimAggs[dim];
    const l = ld ? ld.total.l : 0;
    const r = rd ? rd.total.r : 0;
    const src = {};
    for (const s of allSrcKeys) {
      const ls = ld && ld.src[s] ? ld.src[s].l : 0;
      const rs = rd && rd.src[s] ? rd.src[s].r : 0;
      src[s] = fin(ls, rs);
    }
    dimAggs[dim] = { total: fin(l, r), src };
  }
  const grandSrc = {};
  for (const s of allSrcKeys) {
    const ls = leadsAgg.grandSrc[s] ? leadsAgg.grandSrc[s].l : 0;
    const rs = retailAgg.grandSrc[s] ? retailAgg.grandSrc[s].r : 0;
    grandSrc[s] = fin(ls, rs);
  }
  return { grand: fin(leadsAgg.grand.l, retailAgg.grand.r), grandSrc, dimAggs };
}

/* Returns an extraFilter for univ rows [mi,si,sti,tti,li,...] enforcing
   model/state/leadType filters. Returns null when none are active. */
function makeUnivFilter(filters) {
  const allMdl = !filters.models    || filters.models.size    === 0;
  const allSt  = !filters.states    || filters.states.size    === 0;
  const allLT  = !filters.leadTypes || filters.leadTypes.size === 0;
  if (allMdl && allSt && allLT) return null;
  return (row, maps) => {
    if (!allMdl && !filters.models.has(maps.mdl[row[0]]))    return false;
    if (!allSt  && !filters.states.has(maps.st[row[2]]))     return false;
    if (!allLT  && !filters.leadTypes.has(maps.lt[row[3]])) return false;
    return true;
  };
}

function Nf(n) { return (n == null || isNaN(n)) ? '—' : Number(n).toLocaleString('en-IN'); }
function Pf(n, d=1) { return (n == null || isNaN(n) || n===0) ? '—' : n.toFixed(d) + '%'; }

function formatRetailDate(d) {
  if (!d || !(d instanceof Date) || isNaN(d.getTime())) return '—';
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return String(d.getDate()).padStart(2,'0') + ' ' + months[d.getMonth()] + ' ' + d.getFullYear();
}

const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function monthOrder(m) {
  if (!m) return 0;
  const mt = m.match(/([A-Za-z]+)'(\d+)/);
  if (!mt) return 0;
  return parseInt(mt[2]) * 12 + MONTHS.indexOf(mt[1]);
}

function l2rBadge(pct) {
  if (!pct || isNaN(pct) || pct === 0) return ce('span', { className: 'badge-gray' }, '—');
  const cls = pct >= 15 ? 'badge-green' : pct >= 8 ? 'badge-amber' : 'badge-red';
  return ce('span', { className: 'badge ' + cls }, pct.toFixed(1) + '%');
}

function cellClass(pct) {
  if (!pct || pct === 0) return 'cell-nil';
  if (pct >= 15) return 'cell-hot';
  if (pct >= 8)  return 'cell-warm';
  return 'cell-cold';
}

function grpSum(srcMap, srcs) {
  let l = 0, r = 0;
  for (const s of srcs) { const a = srcMap[s] || EMPTY; l += a.l; r += a.r; }
  return fin(l, r);
}

function exportXlsx(sheetMap, filename) {
  if (!window.XLSX) { alert('XLSX library not loaded'); return; }
  const wb = window.XLSX.utils.book_new();
  for (const [name, aoa] of Object.entries(sheetMap)) {
    const ws = window.XLSX.utils.aoa_to_sheet(aoa);
    const colW = [];
    for (const row of aoa) row.forEach((c, i) => {
      const l = String(c == null ? '' : c).length;
      if (!colW[i] || l > colW[i]) colW[i] = l;
    });
    ws['!cols'] = colW.map(w => ({ wch: Math.min(w + 2, 40) }));
    window.XLSX.utils.book_append_sheet(wb, ws, String(name).slice(0, 31));
  }
  window.XLSX.writeFile(wb, filename + '.xlsx');
}

function exportCsv(aoa, filename) {
  const csv = '\uFEFF' + aoa.map(row =>
    row.map(v => {
      const s = v == null ? '' : String(v);
      return (s.includes(',') || s.includes('"') || s.includes('\n'))
        ? '"' + s.replace(/"/g, '""') + '"'
        : s;
    }).join(',')
  ).join('\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; a.click();
  URL.revokeObjectURL(url);
}

function isRetailedLead(r) {
  if (!r.isBooked || !r.booking_month || !r.lead_month) return false;
  const d = atherMonthOrder(r.booking_month) - atherMonthOrder(r.lead_month);
  return d >= 0 && d <= 2;
}

function exportDetailedCsv(rawJoined, filters, RT, leadsMode, filename, monthOverride) {
  if (!rawJoined || !rawJoined.length) return;
  const { months:mf, sources:sf, leadTypes:ltf, models:mdf, states:stf, cities:cf } = filters;
  const allM   = !mf  || mf.size  === 0;
  const allS   = !sf  || sf.size  === 0;
  const allLT  = !ltf || ltf.size === 0;
  const allMdl = !mdf || mdf.size === 0;
  const allSt  = !stf || stf.size === 0;
  const allCity= !cf  || cf.size  === 0;
  const fmtD   = d => (d instanceof Date && !isNaN(d.getTime())) ? formatRetailDate(d) : '';
  const hdr = ['encrypt_mobile_number','id_verified_lead','opty_id','Date','Lead_Month',
    'brand','model','verified_dealer','dealerId','oem_crm_id','City','State',
    'Dealer_Name','enquiryId','utm_campaign','lead_type','Medium','Status_Name',
    'purchasedModel','performanceMonth','Call Type','Retail_Attribution_Date'];
  const aoa = [hdr];
  for (const r of rawJoined) {
    const effMonth = (leadsMode === 'update' && r.isBooked && r.booking_month) ? r.booking_month : r.lead_month;
    if (monthOverride) {
      if (effMonth !== monthOverride) continue;
    } else if (!allM) {
      if (mf === FILTER_CLEARED) continue;
      if (!mf.has(effMonth)) continue;
    }
    if (!allS) {
      if (sf === FILTER_CLEARED) continue;
      if (!sf.has(r.source)) continue;
    }
    if (!allLT) {
      if (ltf === FILTER_CLEARED) continue;
      if (!ltf.has(r.lt)) continue;
    }
    if (!allMdl) {
      if (mdf === FILTER_CLEARED) continue;
      if (!mdf.has(r.model)) continue;
    }
    if (!allSt) {
      if (stf === FILTER_CLEARED) continue;
      if (!stf.has(r.state)) continue;
    }
    if (!allCity) {
      if (cf === FILTER_CLEARED) continue;
      if (!cf.has(r.city)) continue;
    }
    // Status_Name comes directly from Lead Master; gates columns 19-22
    const statusName = r.statusName || '';
    const normalizedStatus = String(statusName).trim().toLowerCase();
    const isRA = normalizedStatus === 'retail attribution';
    aoa.push([
      r.encryptMobile||'', r.idVerifiedLead||'', r.opty_id,
      fmtD(r.leadDate), r.lead_month, r.brand||'', r.model,
      r.verifiedDealer||'', r.dealerId||'', r.oemCrmId||'',
      r.city, r.state, r.dealerName||'', r.enquiryId||'', r.utmCampaign||'',
      r.lt, r.source,
      statusName,
      isRA ? (r.purchasedModel||'') : '',
      isRA ? (r.booking_month||'') : '',
      isRA ? (r.callType||'') : '',
      isRA ? fmtD(r.retailDate) : '',
    ]);
  }
  exportCsv(aoa, filename);
}
