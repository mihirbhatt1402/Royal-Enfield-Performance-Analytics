name: Refresh Lead Data

# Fetches the Royal Enfield leads Google Sheet nightly, strips unused columns,
# splits by year into compact JSON files, and commits them to RE_LDR/data/.
# The dashboard reads these static files instead of fetching 165 MB live.

on:
  schedule:
    - cron: '0 2 * * *'   # 02:00 UTC daily
  workflow_dispatch:        # manual trigger from Actions tab

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch Google Sheets CSV
        run: |
          echo "Fetching leads sheet…"
          curl -L --max-time 300 --retry 3 --retry-delay 10 \
            'https://docs.google.com/spreadsheets/d/1Ws4xvZuf5HFFrsZ-5g42Bkk5mC_Uy-_XbjkbC-9Grcs/gviz/tq?tqx=out:csv&gid=2097498245' \
            -o /tmp/leads_raw.csv
          ROW_COUNT=$(( $(wc -l < /tmp/leads_raw.csv) - 1 ))
          FILE_SIZE=$(du -h /tmp/leads_raw.csv | cut -f1)
          echo "Downloaded: ${ROW_COUNT} data rows, ${FILE_SIZE}"
          if [ "$ROW_COUNT" -lt 1000 ]; then
            echo "ERROR: suspiciously few rows ($ROW_COUNT) — aborting"
            exit 1
          fi

      - name: Process CSV → compact JSON (split by year)
        run: |
          python3 - << 'PYEOF'
          import csv, json, re, os
          from datetime import datetime, timezone

          # Original sheet columns (0-based):
          # 0  Lead Date        → keep (used as Create Date)
          # 1  Lead Number      → keep
          # 2  Mobile Phone     → DROP (PII, not used by dashboard)
          # 3  EMN              → DROP (encrypted PII, not used)
          # 4  Model            → keep
          # 5  City             → keep
          # 6  State            → keep
          # 7  LT               → keep
          # 8  Source           → keep
          # 9  UTM              → keep (maps to utm_campaign)
          # 10 Duplicate Check  → keep
          # 11 Lead Month       → keep
          # 12 Booking Status   → keep
          # 13 Booking Date     → DROP (not used by dashboard; Booking Month is)
          # 14 Booking Month    → keep

          KEEP = [0, 1, 4, 5, 6, 7, 8, 9, 10, 11, 12, 14]
          OUT_HEADERS = [
              "Lead Date", "Lead Number", "Model", "City", "State",
              "LT", "Source", "UTM", "Duplicate Check",
              "Lead Month", "Booking Status", "Booking Month"
          ]

          def get_year(lead_month_str):
              """'Mar'2026' → 2026, 'Mar'26' → 2026"""
              m = re.search(r"'(\d+)$", lead_month_str or "")
              if not m:
                  return None
              yr = int(m.group(1))
              return yr + 2000 if yr < 100 else yr

          rows_by_year = {}
          total = 0

          with open('/tmp/leads_raw.csv', newline='', encoding='utf-8-sig') as f:
              reader = csv.reader(f)
              _headers = next(reader)   # discard original headers
              for row in reader:
                  if len(row) < 15:
                      continue
                  selected = [row[i] for i in KEEP]
                  # selected[9] = Lead Month after column selection
                  yr = get_year(selected[9])
                  if yr is None:
                      continue
                  rows_by_year.setdefault(yr, []).append(selected)
                  total += 1

          generated = datetime.now(timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')
          os.makedirs('RE_LDR/data', exist_ok=True)

          manifest_files = []
          for yr, rows in sorted(rows_by_year.items()):
              fname = f'RE_LDR/data/leads_{yr}.json'
              payload = {
                  "generated": generated,
                  "headers": OUT_HEADERS,
                  "rows": rows
              }
              with open(fname, 'w', encoding='utf-8') as f:
                  json.dump(payload, f, separators=(',', ':'), ensure_ascii=False)
              size_mb = os.path.getsize(fname) / 1024 / 1024
              print(f"  {fname}: {len(rows):,} rows, {size_mb:.1f} MB")
              manifest_files.append(f"./data/leads_{yr}.json")

          # Write manifest so dashboard can discover available years dynamically
          manifest = {"generated": generated, "files": manifest_files, "total_rows": total}
          with open('RE_LDR/data/manifest.json', 'w') as f:
              json.dump(manifest, f, separators=(',', ':'))

          print(f"\nTotal: {total:,} rows across {len(rows_by_year)} year(s)")
          print(f"Manifest: {manifest_files}")
          PYEOF

      - name: Commit data files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add RE_LDR/data/
          if git diff --cached --quiet; then
            echo "No changes — data files are already up to date."
          else
            DATE=$(date -u +%Y-%m-%d)
            git commit -m "data: nightly leads refresh ${DATE}

Automated refresh by refresh-data.yml workflow.
Sheet: Royal Enfield LDR (GID 2097498245)
Columns: Lead Date, Lead Number, Model, City, State, LT, Source, UTM,
         Duplicate Check, Lead Month, Booking Status, Booking Month
Excluded: Mobile Phone, EMN (PII), Booking Date (not used by dashboard)"
            git push
          fi
